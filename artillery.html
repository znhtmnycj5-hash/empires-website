<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Clanwars — Артиллерист Наполеона</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f;color:#f0e2c4;font-family:Georgia,serif;touch-action:none}
body{display:flex;flex-direction:column}.top{height:62px;flex:0 0 62px;background:#17130f;border-bottom:1px solid #856a3d;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5}
.brand{text-align:center;font-weight:700;letter-spacing:2px;color:#d7b66f;font-size:18px}.brand small{display:block;color:#99876a;font-size:8px;letter-spacing:3px;margin-top:2px}
.back{color:#d7b66f;text-decoration:none;border:1px solid #695434;padding:7px 10px;font-size:10px;letter-spacing:1px}.stats{display:flex;gap:18px;text-align:center;color:#aa9b80;font-size:9px}.stats b{display:block;color:#ead08e;font-size:17px}.stats button{background:none;color:#d7b66f;border:1px solid #695434;width:32px;height:32px;font-family:Georgia,serif;font-size:14px}.stats button:hover{background:#2b2117}
.pause{position:absolute;inset:0;background:rgba(12,9,6,.72);display:none;align-items:center;justify-content:center;z-index:4}.pause .box{background:#17110d;border:1px solid #c49b58;padding:24px 34px;text-align:center}.pause h2{color:#e7c77e;margin:0 0 8px}.pause p{font-size:11px;color:#cdbf9f;margin:0}
#wrap{position:relative;flex:1;min-height:0;background:#b79868}canvas{width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:rgba(24,18,13,.78);border:1px solid #a6844e;padding:8px 11px;box-shadow:0 4px 16px #0004}.hint{font-size:11px;color:#e6d9bd;max-width:330px}.enemy{font-size:11px}.enemy b{color:#e8c978}
.message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,86vw);background:rgba(23,17,12,.95);border:1px solid #c49b58;padding:24px;text-align:center;box-shadow:0 10px 45px #000b;display:none}.message h2{margin:0 0 8px;color:#e7c77e;font-size:24px}.message p{margin:0 0 16px;color:#d7c9ad;font-size:13px;line-height:1.5}.message button{background:#731e18;color:#f4e7c9;border:1px solid #c49b58;padding:10px 18px;font-family:Georgia,serif}
.tip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:10px;color:#efe1c5;background:#17120dcc;border:1px solid #8b7047;padding:6px 10px;pointer-events:none;white-space:nowrap}
@media(max-width:650px){.top{height:52px;flex-basis:52px;padding:0 8px}.brand{font-size:13px}.brand small{font-size:6px}.stats{gap:7px}.stats b{font-size:14px}.back{font-size:8px;padding:6px}.hud{top:7px;left:7px;right:7px}.panel{padding:6px 8px}.hint{font-size:9px;max-width:205px}.tip{bottom:8px;font-size:9px}}
</style>
</head>
<body>
<header class="top">
<a class="back" href="index.html">← CLANWARS</a>
<div class="brand">АРТИЛЛЕРИСТ<small>NAPOLEON BONAPARTE</small></div>
<div class="stats"><div>ОЧКИ<b id="score">0</b></div><div>ЯДРА<b id="shots">6</b></div><div>УРОВЕНЬ<b id="level">1</b></div><button id="pauseBtn" aria-label="Пауза">Ⅱ</button></div>
</header>
<div id="wrap">
<canvas id="game"></canvas>
<div class="hud">
<div class="panel hint" id="hint">Потяните от пушки назад и отпустите. На телефоне — пальцем.</div>
<div class="panel enemy"><b id="enemyCount">6</b> солдат</div>
</div>
<div class="tip">💥 Попадание по бочке или ящику вызывает дополнительный взрыв</div>
<div class="pause" id="pause"><div class="box"><h2>Пауза</h2><p>Сражение приостановлено</p></div></div><div class="message" id="message"><h2 id="messageTitle"></h2><p id="messageText"></p><button id="messageBtn">Продолжить</button></div>
</div>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap');
let W=0,H=0,dpr=1,drag=null,ball=null,particles=[],smoke=[],score=Number(localStorage.getItem('clanwars_artillery_score')||0),shots=6,level=1,finished=false,paused=false,audio=null;
const enemies=[],objects=[];
const levels=[
 {nation:'Британская армия',count:6,uniform:'#8e201d',facings:'#d6d0b9',hat:'#191817'},
 {nation:'Русская армия',count:8,uniform:'#536a48',facings:'#d7d0bb',hat:'#c8c1aa'},
 {nation:'Прусская армия',count:9,uniform:'#273b61',facings:'#c8c3ae',hat:'#171717'},
 {nation:'Австрийская армия',count:10,uniform:'#f0eee2',facings:'#20201e',hat:'#171717'}
];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize);
function setup(){enemies.length=0;objects.length=0;ball=null;particles=[];smoke=[];shots=6;finished=false;paused=false;document.getElementById('pause').style.display='none';
 const L=levels[(level-1)%levels.length], n=L.count, cols=Math.min(5,Math.ceil(Math.sqrt(n))), sx=W*.64, sy=H-104, dx=Math.min(62,W*.082), dy=52;
 // regiment-style national standard
 objects.push({x:W*.93,y:H-112,w:4,h:64,type:'flagpole',hp:1});
 for(let i=0;i<n;i++){let col=i%cols,row=Math.floor(i/cols);enemies.push({x:sx+col*dx,y:sy-row*dy,r:16,alive:true})}
 objects.push({x:W*.58,y:H-76,w:44,h:36,type:'crate',hp:1},{x:W*.84,y:H-70,w:38,h:48,type:'barrel',hp:1});
 document.getElementById('shots').textContent=shots;document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;document.getElementById('enemyCount').textContent=n;document.getElementById('message').style.display='none';document.getElementById('hint').textContent='Потяните от пушки назад и отпустите.';draw()}
function cannon(){return{x:Math.max(78,W*.13),y:H-86}}
function saveScore(){localStorage.setItem('clanwars_artillery_score',String(score))}
function togglePause(){if(finished)return;paused=!paused;document.getElementById('pause').style.display=paused?'flex':'none';drag=null}
document.getElementById('pauseBtn').onclick=togglePause;
function ground(){return H-48}
function rect(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.strokeRect(x+.5,y+.5,w-1,h-1)}}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#506b7a');g.addColorStop(.48,'#9caeaa');g.addColorStop(1,'#d0b47b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ead9a633';ctx.beginPath();ctx.arc(W*.78,H*.2,62,0,Math.PI*2);ctx.fill();
 // distant clouds
 ctx.fillStyle='#e8e3d833';for(let i=0;i<4;i++){let x=W*(.12+i*.25),y=H*(.16+(i%2)*.08);ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.arc(x+25,y-7,28,0,Math.PI*2);ctx.arc(x+52,y,20,0,Math.PI*2);ctx.fill()}
 // distant hills
 ctx.fillStyle='#55614e';ctx.beginPath();ctx.moveTo(0,ground()+20);for(let x=0;x<=W;x+=70)ctx.quadraticCurveTo(x+35,ground()-35,x+70,ground()+20);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // trees
 ctx.fillStyle='#3f4b3b';for(let i=0;i<12;i++){let x=(i*97)%Math.max(W,1),y=ground()+10-(i%3)*7;ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();ctx.fillRect(x-4,y,8,28)}
}
function terrain(){rect(0,ground(),W,H-ground(),'#6f583e');ctx.fillStyle='#574633';for(let x=0;x<W;x+=25){ctx.fillRect(x,ground()+5,14,2);ctx.fillRect(x+7,ground()+20,9,2)}}
function napoleon(){const p=cannon();ctx.save();ctx.translate(p.x-5,p.y-23);
 ctx.fillStyle='#3c4248';ctx.beginPath();ctx.roundRect(-15,-39,30,42,3);ctx.fill();
 ctx.fillStyle='#d4b28d';ctx.beginPath();ctx.arc(0,-50,10,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#1b1b1b';ctx.fillRect(-14,-62,28,5);ctx.fillRect(-8,-68,16,7);
 ctx.fillStyle='#c9a552';ctx.fillRect(-13,-32,26,3);ctx.fillRect(-11,-24,4,13);ctx.fillRect(7,-24,4,13);
 ctx.fillStyle='#25292c';ctx.fillRect(-19,2,12,24);ctx.fillRect(7,2,12,24);ctx.fillStyle='#171717';ctx.fillRect(-23,25,16,4);ctx.fillRect(7,25,16,4);
 ctx.restore()}
function cannonDraw(){const p=cannon();let ang=drag?Math.atan2(p.y-drag.y,p.x-drag.x):-.35;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#2b2926';ctx.beginPath();ctx.arc(-25,14,14,0,Math.PI*2);ctx.arc(25,14,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#594027';ctx.fillRect(-37,0,74,11);ctx.rotate(ang);ctx.fillStyle='#272522';ctx.fillRect(-2,-8,66,16);ctx.fillStyle='#544638';ctx.fillRect(17,-4,43,8);ctx.fillStyle='#c09a51';ctx.fillRect(5,-9,4,18);ctx.restore()}
function soldier(e){const L=levels[(level-1)%levels.length];ctx.save();ctx.translate(e.x,e.y);
 ctx.fillStyle=L.uniform;ctx.beginPath();ctx.roundRect(-10,-5,20,27,3);ctx.fill();
 ctx.fillStyle=L.facings;ctx.fillRect(-7,-1,14,4);ctx.fillStyle='#d5ae88';ctx.beginPath();ctx.arc(0,-15,8,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=L.hat;ctx.fillRect(-10,-23,20,5);ctx.fillRect(-6,-28,12,6);
 ctx.strokeStyle='#27221d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,21);ctx.lineTo(-5,31);ctx.moveTo(4,21);ctx.lineTo(5,31);ctx.stroke();
 ctx.strokeStyle='#3b2b1e';ctx.beginPath();ctx.moveTo(8,-3);ctx.lineTo(20,17);ctx.stroke();ctx.restore()}
function objectDraw(o){ctx.save();ctx.translate(o.x,o.y);if(o.type==='crate'){rect(-o.w/2,0,o.w,o.h,'#76502d','#3d2a1c');ctx.strokeStyle='#3d2a1c';ctx.beginPath();ctx.moveTo(-o.w/2,0);ctx.lineTo(o.w/2,o.h);ctx.moveTo(o.w/2,0);ctx.lineTo(-o.w/2,o.h);ctx.stroke()}else{ctx.fillStyle='#70432a';ctx.beginPath();ctx.ellipse(0,0,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3c2619';ctx.stroke();ctx.fillStyle='#c59b57';ctx.fillRect(-o.w/2,-o.h*.22,o.w,4);ctx.fillRect(-o.w/2,o.h*.16,o.w,4)}ctx.restore()}
function aim(){if(!drag)return;const p=cannon(),dx=p.x-drag.x,dy=p.y-drag.y,len=Math.max(1,Math.hypot(dx,dy)),power=Math.min(900,len*7),vx=dx/len*power,vy=dy/len*power;
 ctx.save();ctx.strokeStyle='#ead28d';ctx.setLineDash([5,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(drag.x,drag.y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ead28d99';
 for(let t=.15;t<1.7;t+=.15){let x=p.x+vx*t,y=p.y+vy*t+490*t*t/2;if(y<ground()){ctx.beginPath();ctx.arc(x,y,2.6,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function draw(){drawSky();terrain();objects.forEach(objectDraw);enemies.filter(e=>e.alive).forEach(soldier);if(ball){ctx.fillStyle='#171615';ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7d6b55';ctx.stroke()}cannonDraw();napoleon();aim();
 smoke.forEach(s=>{ctx.globalAlpha=s.life*.22;ctx.fillStyle='#ddd6c7';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);});ctx.globalAlpha=1}
function boom(x,y,big=false){for(let i=0;i<(big?36:20);i++)particles.push({x,y,vx:(Math.random()-.5)*(big?7:4),vy:(Math.random()-.8)*(big?7:4),life:1,size:Math.random()*4+2,color:i%3?'#b78b4b':'#e5d0a1'});for(let i=0;i<5;i++)smoke.push({x:x+(Math.random()-.5)*15,y:y+(Math.random()-.5)*15,size:12+Math.random()*15,life:1})}
function sound(kind){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=kind==='shot'?'sawtooth':'sine';o.frequency.value=kind==='shot'?90:180;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+(kind==='shot'?.18:.08));o.start();o.stop(audio.currentTime+(kind==='shot'?.18:.08))}catch(e){}}
function fire(target){if(ball||shots<=0||finished)return;const p=cannon(),dx=p.x-target.x,dy=p.y-target.y,len=Math.max(30,Math.hypot(dx,dy)),power=Math.min(900,len*7);ball={x:p.x,y:p.y,vx:dx/len*power,vy:dy/len*power};shots--;document.getElementById('shots').textContent=shots;drag=null;sound('shot');smoke.push({x:p.x+48,y:p.y-10,size:18,life:1});document.getElementById('hint').textContent='Выстрел!'}
function hit(){const b=ball;if(!b)return;
 for(const o of objects){if(o.hp&&Math.abs(b.x-o.x)<o.w/2+8&&Math.abs(b.y-(o.y+o.h/2))<o.h/2+8){o.hp=0;boom(o.x,o.y+o.h/2,true);score+=50;document.getElementById('score').textContent=score;saveScore();ball=null;afterShot();return}}
 for(const e of enemies){if(e.alive&&Math.hypot(b.x-e.x,b.y-e.y)<24){e.alive=false;score+=100;document.getElementById('score').textContent=score;saveScore();boom(e.x,e.y);sound('hit');ball=null;afterShot();return}}}
function afterShot(){const left=enemies.filter(e=>e.alive).length;document.getElementById('enemyCount').textContent=left;if(left===0){finished=true;show('Позиция взята','Артиллерия Великой армии уничтожила противника.','Следующий уровень')}else if(shots===0){finished=true;show('Боезапас исчерпан','Вражеские солдаты удержали позицию.','Повторить уровень')}else document.getElementById('hint').textContent='Прицел готов. Следующий выстрел.'}
function show(t,p,b){document.getElementById('messageTitle').textContent=t;document.getElementById('messageText').textContent=p;document.getElementById('messageBtn').textContent=b;document.getElementById('message').style.display='block'}
function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function down(e){if(finished||ball||paused)return;const p=point(e),q=cannon();if(Math.hypot(p.x-q.x,p.y-q.y)<95){drag={x:p.x,y:p.y};c.setPointerCapture?.(e.pointerId);e.preventDefault()}}
function move(e){if(!drag||paused)return;const p=point(e);drag.x=p.x;drag.y=p.y;e.preventDefault();draw()}
function up(e){if(!drag)return;const p=point(e);fire(p);drag=null;e.preventDefault()}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});
document.getElementById('messageBtn').onclick=()=>{if(document.getElementById('messageBtn').textContent==='Следующий уровень')level++;setup()};
function loop(){if(!paused&&ball){ball.x+=ball.vx/60;ball.y+=ball.vy/60;ball.vy+=490/60;hit();if(ball&& (ball.y>ground()||ball.x>W+60||ball.x<-60)){boom(ball.x,Math.min(ball.y,ground()));ball=null;afterShot()}}
 if(!paused){particles=particles.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vy+=.12,p.life-=.025,p.life>0));smoke=smoke.filter(s=>(s.size+=.15,s.life-=.012,s.life>0));}draw();requestAnimationFrame(loop)}
resize();setup();loop();
})();
</script>
</body>
</html>
