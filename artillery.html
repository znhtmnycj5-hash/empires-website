<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ClanWars — Артиллерист Наполеона</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120f0c;color:#f0e2c4;font-family:Georgia,serif;touch-action:none}
body{display:flex;flex-direction:column}.top{height:62px;flex:0 0 62px;background:linear-gradient(180deg,#17130f,#100d0a);border-bottom:1px solid #8d6c38;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5;box-shadow:0 3px 15px #0009}
.brand{text-align:center;font-weight:700;letter-spacing:3px;color:#d7b66f;font-size:18px;text-shadow:0 1px 0 #000}.brand small{display:block;color:#99876a;font-size:8px;letter-spacing:3px;margin-top:3px}
.back{color:#d7b66f;text-decoration:none;border:1px solid #695434;padding:7px 10px;font-size:10px;letter-spacing:1px;background:#1b1510}.back:hover{background:#2b2117}.stats{display:flex;gap:18px;text-align:center;color:#aa9b80;font-size:9px;align-items:center}.stats b{display:block;color:#ead08e;font-size:17px}.stats button{background:#17120e;color:#d7b66f;border:1px solid #695434;width:32px;height:32px;font-family:Georgia,serif;font-size:14px}
#wrap{position:relative;flex:1;min-height:0;background:#b79868}canvas{width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.panel{background:linear-gradient(180deg,#211a13dd,#17120ed9);border:1px solid #a6844e;padding:9px 12px;box-shadow:0 5px 18px #0006}.hint{font-size:11px;color:#e6d9bd;max-width:350px}.enemy{font-size:11px}.enemy b{color:#e8c978}
.message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,88vw);background:linear-gradient(180deg,#211912f7,#120e0bf7);border:1px solid #c49b58;padding:28px;text-align:center;box-shadow:0 15px 60px #000d;display:none}.message h2{margin:0 0 9px;color:#e7c77e;font-size:25px;font-family:Georgia,serif}.message p{margin:0 0 18px;color:#d7c9ad;font-size:13px;line-height:1.55}.message button{background:linear-gradient(#8a3028,#601a16);color:#f4e7c9;border:1px solid #c49b58;padding:10px 20px;font-family:Georgia,serif;cursor:pointer}
.pause{position:absolute;inset:0;background:rgba(12,9,6,.72);display:none;align-items:center;justify-content:center;z-index:4}.pause .box{background:#17110d;border:1px solid #c49b58;padding:25px 36px;text-align:center;box-shadow:0 15px 45px #0009}.pause h2{color:#e7c77e;margin:0 0 8px}.pause p{font-size:11px;color:#cdbf9f;margin:0}
.tip{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:10px;color:#efe1c5;background:#17120ddd;border:1px solid #8b7047;padding:7px 11px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 15px #0005}
@media(max-width:650px){.top{height:52px;flex-basis:52px;padding:0 8px}.brand{font-size:13px;letter-spacing:2px}.brand small{font-size:6px}.stats{gap:7px}.stats b{font-size:14px}.back{font-size:8px;padding:6px}.hud{top:7px;left:7px;right:7px}.panel{padding:6px 8px}.hint{font-size:9px;max-width:205px}.tip{bottom:8px;font-size:8px}}
</style>
</head>
<body>
<header class="top">
<a class="back" href="index.html">← CLANWARS</a>
<div class="brand">АРТИЛЛЕРИСТ<small>NAPOLEON BONAPARTE</small></div>
<div class="stats"><div>ОЧКИ<b id="score">0</b></div><div>ЯДРА<b id="shots">6</b></div><div>УРОВЕНЬ<b id="level">1</b></div><button id="pauseBtn" aria-label="Пауза">Ⅱ</button></div>
</header>
<div id="wrap">
<canvas id="game"></canvas>
<div class="hud"><div class="panel hint" id="hint">Потяните от пушки назад и отпустите. На телефоне — пальцем.</div><div class="panel enemy"><b id="enemyCount">6</b> солдат</div></div>
<div class="tip">💥 Бочки и ящики разрушаются от прямого попадания</div>
<div class="pause" id="pause"><div class="box"><h2>Пауза</h2><p>Сражение приостановлено</p></div></div>
<div class="message" id="message"><h2 id="messageTitle"></h2><p id="messageText"></p><button id="messageBtn">Продолжить</button></div>
</div>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap');
let W=0,H=0,dpr=1,drag=null,ball=null,particles=[],smoke=[],score=Number(localStorage.getItem('clanwars_artillery_score')||0),shots=6,level=1,finished=false,paused=false,audio=null;
const enemies=[],objects=[];
const levels=[
 {nation:'Британская армия',count:6,uniform:'#8e201d',facings:'#d6d0b9',hat:'#191817'},
 {nation:'Русская армия',count:8,uniform:'#536a48',facings:'#d7d0bb',hat:'#c8c1aa'},
 {nation:'Прусская армия',count:9,uniform:'#273b61',facings:'#c8c3ae',hat:'#171717'},
 {nation:'Австрийская армия',count:10,uniform:'#f0eee2',facings:'#20201e',hat:'#171717'}
];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize);
function setup(){
 enemies.length=0;objects.length=0;ball=null;particles=[];smoke=[];shots=6;finished=false;paused=false;
 document.getElementById('pause').style.display='none';
 const L=levels[(level-1)%levels.length],n=L.count;
 const cols=Math.min(5,Math.ceil(Math.sqrt(n))),sx=W*.64,sy=H-112,dx=Math.min(62,W*.082),dy=54;
 for(let i=0;i<n;i++){let col=i%cols,row=Math.floor(i/cols);enemies.push({x:sx+col*dx,y:sy-row*dy,r:16,alive:true})}
 objects.push({x:W*.57,y:H-79,w:48,h:40,type:'crate',hp:1},{x:W*.83,y:H-75,w:40,h:52,type:'barrel',hp:1});
 objects.push({x:W*.93,y:H-110,w:4,h:70,type:'flagpole',hp:1});
 document.getElementById('shots').textContent=shots;document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;document.getElementById('enemyCount').textContent=n;document.getElementById('message').style.display='none';document.getElementById('hint').textContent='Потяните от пушки назад и отпустите.';draw()
}
function cannon(){return{x:Math.max(78,W*.13),y:H-86}} function ground(){return H-48}
function saveScore(){localStorage.setItem('clanwars_artillery_score',String(score))}
function togglePause(){if(finished)return;paused=!paused;document.getElementById('pause').style.display=paused?'flex':'none';drag=null}
document.getElementById('pauseBtn').onclick=togglePause;
function rect(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.strokeRect(x+.5,y+.5,w-1,h-1)}}
function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3f5664');g.addColorStop(.42,'#8fa1a2');g.addColorStop(1,'#c7ad78');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#f2e1a322';ctx.beginPath();ctx.arc(W*.78,H*.2,58,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#eee8d833';for(let i=0;i<4;i++){let x=W*(.08+i*.27),y=H*(.15+(i%2)*.07);ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.arc(x+23,y-6,27,0,Math.PI*2);ctx.arc(x+48,y,18,0,Math.PI*2);ctx.fill()}
 // distant hills
 ctx.fillStyle='#53604f';ctx.beginPath();ctx.moveTo(0,ground()+25);for(let x=0;x<W;x+=70)ctx.quadraticCurveTo(x+35,ground()-42,x+70,ground()+25);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // far village
 for(let i=0;i<5;i++){let x=W*(.38+i*.055),y=ground()-18-(i%2)*7;rect(x,y,28,19,'#625449');ctx.fillStyle='#4b3d34';ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+14,y-12);ctx.lineTo(x+31,y);ctx.fill()}
 // trees
 ctx.fillStyle='#39463a';for(let i=0;i<13;i++){let x=(i*97)%Math.max(W,1),y=ground()+7-(i%3)*9;ctx.beginPath();ctx.arc(x,y,19+(i%2)*6,0,Math.PI*2);ctx.fill();ctx.fillRect(x-4,y,8,31)}
}
function terrain(){
 rect(0,ground(),W,H-ground(),'#66503b');
 ctx.fillStyle='#493b2f';for(let x=0;x<W;x+=23){ctx.fillRect(x,ground()+6,14,2);ctx.fillRect(x+7,ground()+21,10,2)}
 // foreground earth berm
 ctx.fillStyle='#4e3b2c';ctx.beginPath();ctx.moveTo(W*.46,ground());ctx.lineTo(W*.46,ground()-24);ctx.quadraticCurveTo(W*.55,ground()-39,W*.63,ground()-22);ctx.lineTo(W*.63,ground());ctx.fill();
}
function drawFlag(){
 const x=W*.93,y=H-110;ctx.save();ctx.fillStyle='#4b3a27';ctx.fillRect(x,y,4,70);
 const L=levels[(level-1)%levels.length];let flag=L.uniform;ctx.fillStyle=flag;ctx.beginPath();ctx.moveTo(x+4,y+4);ctx.quadraticCurveTo(x+23,y+9,x+40,y+5);ctx.lineTo(x+40,y+34);ctx.quadraticCurveTo(x+22,y+29,x+4,y+34);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#d4b36b';ctx.stroke();ctx.fillStyle='#e7d39c';ctx.beginPath();ctx.arc(x+20,y+19,6,0,Math.PI*2);ctx.fill();ctx.restore();
}
function napoleon(){
 const p=cannon();ctx.save();ctx.translate(p.x-7,p.y-23);
 // legs
 ctx.fillStyle='#22282c';ctx.fillRect(-18,4,13,25);ctx.fillRect(6,4,13,25);ctx.fillStyle='#171717';ctx.fillRect(-22,27,17,5);ctx.fillRect(6,27,17,5);
 // greatcoat
 ctx.fillStyle='#3b4147';ctx.beginPath();ctx.roundRect(-17,-39,34,47,4);ctx.fill();
 // red collar + lapels
 ctx.fillStyle='#731e18';ctx.beginPath();ctx.moveTo(-10,-39);ctx.lineTo(0,-31);ctx.lineTo(10,-39);ctx.lineTo(8,-28);ctx.lineTo(0,-22);ctx.lineTo(-8,-28);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#d2b05d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-11,-31);ctx.lineTo(-2,-22);ctx.moveTo(11,-31);ctx.lineTo(2,-22);ctx.stroke();
 // buttons
 ctx.fillStyle='#d5b45f';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-4,-17+i*8,1.7,0,Math.PI*2);ctx.arc(4,-17+i*8,1.7,0,Math.PI*2);ctx.fill()}
 // head
 ctx.fillStyle='#d4ad88';ctx.beginPath();ctx.arc(0,-51,11,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle='#2b241f';ctx.fillRect(-8,-59,16,5);
 // bicorne
 ctx.fillStyle='#151515';ctx.beginPath();ctx.moveTo(-16,-62);ctx.quadraticCurveTo(0,-69,16,-62);ctx.lineTo(12,-55);ctx.lineTo(-12,-55);ctx.closePath();ctx.fill();ctx.fillRect(-17,-57,34,4);
 // arm
 ctx.strokeStyle='#3b4147';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(12,-20);ctx.lineTo(27,-5);ctx.stroke();ctx.fillStyle='#d4ad88';ctx.beginPath();ctx.arc(27,-5,5,0,Math.PI*2);ctx.fill();
 // gold epaulettes
 ctx.fillStyle='#c9a552';ctx.fillRect(-16,-29,8,4);ctx.fillRect(8,-29,8,4);
 ctx.restore();
}
function cannonDraw(){
 const p=cannon(),ang=drag?Math.atan2(p.y-drag.y,p.x-drag.x):-.35;ctx.save();ctx.translate(p.x,p.y);
 // shadow
 ctx.fillStyle='#33281e';ctx.beginPath();ctx.ellipse(0,22,56,10,0,0,Math.PI*2);ctx.fill();
 // carriage
 ctx.fillStyle='#674729';ctx.fillRect(-40,1,80,12);
 ctx.strokeStyle='#2e241c';ctx.lineWidth=3;ctx.strokeRect(-40,1,80,12);
 // wheels
 for(const x of [-28,28]){ctx.fillStyle='#30271f';ctx.beginPath();ctx.arc(x,14,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8b7047';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#624b32';for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(x,14);ctx.lineTo(x+Math.cos(i*Math.PI/4)*13,14+Math.sin(i*Math.PI/4)*13);ctx.stroke()}}
 ctx.rotate(ang);
 ctx.fillStyle='#252525';ctx.fillRect(-4,-9,69,18);ctx.fillStyle='#4d4b46';ctx.fillRect(10,-5,49,10);ctx.fillStyle='#b9934c';ctx.fillRect(3,-10,5,20);ctx.fillStyle='#171717';ctx.beginPath();ctx.arc(65,0,9,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function soldier(e){
 const L=levels[(level-1)%levels.length];ctx.save();ctx.translate(e.x,e.y);
 // shadow
 ctx.fillStyle='#3b3026aa';ctx.beginPath();ctx.ellipse(0,30,17,5,0,0,Math.PI*2);ctx.fill();
 // body
 ctx.fillStyle=L.uniform;ctx.beginPath();ctx.roundRect(-11,-5,22,29,4);ctx.fill();
 // facings
 ctx.fillStyle=L.facings;ctx.fillRect(-8,-2,16,4);
 // crossbelt
 ctx.strokeStyle='#e4d8bb';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,-2);ctx.lineTo(8,18);ctx.stroke();
 // face
 ctx.fillStyle='#d5ad87';ctx.beginPath();ctx.arc(0,-15,8,0,Math.PI*2);ctx.fill();
 // hair/hat
 ctx.fillStyle=L.hat;ctx.fillRect(-10,-23,20,5);ctx.fillRect(-6,-29,12,7);
 // legs
 ctx.strokeStyle='#29231e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-4,23);ctx.lineTo(-5,32);ctx.moveTo(4,23);ctx.lineTo(5,32);ctx.stroke();
 // musket
 ctx.strokeStyle='#4a3423';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,-4);ctx.lineTo(23,22);ctx.stroke();ctx.fillStyle='#c7c1b0';ctx.fillRect(21,18,3,7);
 ctx.restore();
}
function objectDraw(o){
 ctx.save();ctx.translate(o.x,o.y);
 if(o.type==='crate'){rect(-o.w/2,0,o.w,o.h,'#76502d','#3d2a1c');ctx.strokeStyle='#b28b52';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-o.w/2,0);ctx.lineTo(o.w/2,o.h);ctx.moveTo(o.w/2,0);ctx.lineTo(-o.w/2,o.h);ctx.stroke()}
 else if(o.type==='barrel'){ctx.fillStyle='#70432a';ctx.beginPath();ctx.ellipse(0,0,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3c2619';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#c59b57';ctx.fillRect(-o.w/2,-o.h*.22,o.w,4);ctx.fillRect(-o.w/2,o.h*.16,o.w,4)}
 ctx.restore();
}
function aim(){
 if(!drag)return;const p=cannon(),dx=p.x-drag.x,dy=p.y-drag.y,len=Math.max(1,Math.hypot(dx,dy)),power=Math.min(900,len*7),vx=dx/len*power,vy=dy/len*power;
 ctx.save();ctx.strokeStyle='#ead28d';ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(drag.x,drag.y);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#f0d48b';for(let t=.15;t<1.7;t+=.15){let x=p.x+vx*t,y=p.y+vy*t+490*t*t/2;if(y<ground()){ctx.globalAlpha=Math.max(.15,1-t*.45);ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.restore();
}
function draw(){
 drawSky();terrain();drawFlag();objects.forEach(objectDraw);enemies.filter(e=>e.alive).forEach(soldier);
 if(ball){ctx.fillStyle='#171615';ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8e7657';ctx.stroke()}
 cannonDraw();napoleon();aim();
 smoke.forEach(s=>{ctx.globalAlpha=s.life*.23;ctx.fillStyle='#ddd6c7';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill()});
 ctx.globalAlpha=1;particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;
}
function boom(x,y,big=false){
 for(let i=0;i<(big?38:24);i++)particles.push({x,y,vx:(Math.random()-.5)*(big?8:5),vy:(Math.random()-.8)*(big?8:5),life:1,size:Math.random()*4+2,color:i%3?'#b78b4b':'#e5d0a1'});
 for(let i=0;i<(big?8:5);i++)smoke.push({x:x+(Math.random()-.5)*18,y:y+(Math.random()-.5)*18,size:12+Math.random()*18,life:1});
}
function sound(kind){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=kind==='shot'?'sawtooth':'sine';o.frequency.value=kind==='shot'?90:180;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+(kind==='shot'?.18:.08));o.start();o.stop(audio.currentTime+(kind==='shot'?.18:.08))}catch(e){}}
function fire(target){
 if(ball||shots<=0||finished)return;const p=cannon(),dx=p.x-target.x,dy=p.y-target.y,len=Math.max(30,Math.hypot(dx,dy)),power=Math.min(900,len*7);
 ball={x:p.x,y:p.y,vx:dx/len*power,vy:dy/len*power};shots--;document.getElementById('shots').textContent=shots;drag=null;sound('shot');smoke.push({x:p.x+48,y:p.y-10,size:18,life:1});document.getElementById('hint').textContent='Выстрел!'}
function hit(){
 const b=ball;if(!b)return;
 for(const o of objects){if(o.hp&&o.type!=='flagpole'&&Math.abs(b.x-o.x)<o.w/2+8&&Math.abs(b.y-(o.y+o.h/2))<o.h/2+8){o.hp=0;boom(o.x,o.y+o.h/2,true);score+=50;document.getElementById('score').textContent=score;saveScore();ball=null;afterShot();return}}
 for(const e of enemies){if(e.alive&&Math.hypot(b.x-e.x,b.y-e.y)<24){e.alive=false;score+=100;document.getElementById('score').textContent=score;saveScore();boom(e.x,e.y);sound('hit');ball=null;afterShot();return}}
}
function afterShot(){
 const left=enemies.filter(e=>e.alive).length;document.getElementById('enemyCount').textContent=left;
 if(left===0){finished=true;show('ПОЗИЦИЯ ВЗЯТА','Артиллерия Великой армии уничтожила противника.','Следующий уровень')}
 else if(shots===0){finished=true;show('БОЕПРИПАСЫ ИСЧЕРПАНЫ','Вражеские солдаты удержали позицию.','Повторить уровень')}
 else document.getElementById('hint').textContent='Прицел готов. Следующий выстрел.'
}
function show(t,p,b){document.getElementById('messageTitle').textContent=t;document.getElementById('messageText').textContent=p;document.getElementById('messageBtn').textContent=b;document.getElementById('message').style.display='block'}
function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function down(e){if(finished||ball||paused)return;const p=point(e),q=cannon();if(Math.hypot(p.x-q.x,p.y-q.y)<95){drag={x:p.x,y:p.y};c.setPointerCapture?.(e.pointerId);e.preventDefault()}}
function move(e){if(!drag||paused)return;const p=point(e);drag.x=p.x;drag.y=p.y;e.preventDefault();draw()}
function up(e){if(!drag)return;const p=point(e);fire(p);drag=null;e.preventDefault()}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});
document.getElementById('messageBtn').onclick=()=>{if(document.getElementById('messageBtn').textContent==='Следующий уровень')level++;setup()};
function loop(){
 if(!paused&&ball){ball.x+=ball.vx/60;ball.y+=ball.vy/60;ball.vy+=490/60;hit();if(ball&&(ball.y>ground()||ball.x>W+60||ball.x<-60)){boom(ball.x,Math.min(ball.y,ground()));ball=null;afterShot()}}
 if(!paused){particles=particles.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vy+=.12,p.life-=.025,p.life>0));smoke=smoke.filter(s=>(s.size+=.15,s.life-=.012,s.life>0))}
 draw();requestAnimationFrame(loop)
}
resize();setup();loop();
})();
</script>
</body>
</html>
