<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Кавалерист — Low Poly 3D Models</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b20;color:#f1dfb3;font-family:Georgia,serif}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
header{position:absolute;z-index:2;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}h1{font-size:clamp(18px,3vw,30px);margin:0;text-shadow:0 2px 8px #000}header a{pointer-events:auto;color:#e9d5a5;text-decoration:none;border:1px solid #98743a;padding:9px 12px;border-radius:8px;background:#17130edb;font-size:13px}
#selector{position:absolute;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;max-width:96vw}button{border:1px solid #b08a3c;background:#201c18;color:#f4e5c2;border-radius:10px;padding:12px 17px;font: bold 14px Georgia;white-space:nowrap}button.active{background:#80602c;color:white;box-shadow:0 0 0 2px #e4c47d55}
#info{position:absolute;z-index:2;left:16px;bottom:92px;max-width:min(360px,90vw);background:#17130edb;border:1px solid #98743a;border-radius:10px;padding:12px 15px;line-height:1.45}#info b{color:#f4d58f}#hint{position:absolute;right:16px;bottom:98px;color:#e8d9b8;background:#17130eaa;padding:9px 12px;border-radius:8px;font-size:12px}
@media(max-width:600px){#selector{bottom:12px;gap:5px}button{padding:11px 10px;font-size:12px}#info{bottom:72px;left:10px;font-size:12px}#hint{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<header><h1>КАВАЛЕРИСТ · LOW POLY 3D</h1><a href="cavalier.html">← Вернуться в игру</a></header>
<div id="info"><b>РУССКИЙ КАВАЛЕРИЙСКИЙ ОФИЦЕР</b><br>Игровой персонаж · тёмно-синий мундир, золотой прибор, палаш и гнедая лошадь.</div>
<div id="hint">Поворачивайте модель пальцем или мышью</div>
<div id="selector"><button class="active" data-model="player">🇷🇺 Кавалерист</button><button data-model="british">🇬🇧 Пехота</button><button data-model="hussar">🐎 Гусар</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.getElementById('stage');
const scene=new THREE.Scene();scene.background=new THREE.Color('#8b9aa2');scene.fog=new THREE.Fog('#8b9aa2',15,34);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(5,3.4,9);camera.lookAt(0,1.45,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f0ff,0x514638,2));
const sun=new THREE.DirectionalLight(0xffe1b0,3.1);sun.position.set(-4,8,6);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(8,48),new THREE.MeshStandardMaterial({color:'#777b70',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(16,32,0x76684e,0x9b927d);grid.position.y=-.025;scene.add(grid);
const mat=(color,roughness=.82,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness,flatShading:true});
const M={navy:mat('#183653'),red:mat('#a52b25'),black:mat('#17191b'),gold:mat('#c99b43',.48,.35),cream:mat('#e8ddc5'),skin:mat('#bd8967'),brown:mat('#65432c'),horse:mat('#70472e'),gray:mat('#aaa99d'),steel:mat('#b9c1c5',.32,.7),leather:mat('#493326'),blue:mat('#233e78'),white:mat('#eee9dc'),darkred:mat('#711d20')};
function group(parent,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g}
function mesh(parent,geo,material,x,y,z,sx=1,sy=1,sz=1){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(p,m,x,y,z,sx,sy,sz){return mesh(p,new THREE.BoxGeometry(1,1,1),m,x,y,z,sx,sy,sz)}
function ball(p,m,x,y,z,sx,sy,sz,detail=1){return mesh(p,new THREE.IcosahedronGeometry(1,detail),m,x,y,z,sx,sy,sz)}
function limb(p,m,a,b,r1=.075,r2=.065){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const o=mesh(p,new THREE.CylinderGeometry(r2,r1,d.length(),5),m,...A.clone().add(B).multiplyScalar(.5).toArray());o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o}
function sword(p,x,y,z,length=1.1){const blade=mesh(p,new THREE.ConeGeometry(.045,length,4),M.steel,x,y+length*.48,z,.65,1,.65);blade.rotation.z=-.12;box(p,M.gold,x,y,z,.28,.045,.07)}
function makeHorse(parent,coat){const h=group(parent,0,0,0);ball(h,coat,0,1.05,0,.92,.48,.34,2);ball(h,coat,.72,1.48,0,.28,.62,.27,1).rotation.z=-.32;ball(h,coat,.95,1.86,0,.32,.22,.25,1);ball(h,M.black,.98,2.02,0,.12,.18,.13,1);for(const z of [-.18,.18]){ball(h,M.black,.87,2.05,z,.035,.035,.035,1);limb(h,M.black,[.85,1.1,z],[.95,.65,z],.035,.025)}const legs=[];for(const x of [-.58,.48])for(const z of [-.22,.22]){const leg=group(h,x,.85,z);limb(leg,coat,[0,0,0],[.02,-.48,0],.095,.07);limb(leg,M.black,[.02,-.48,0],[.08,-.91,0],.065,.035);legs.push(leg)}limb(h,M.black,[-.78,1.25,0],[-1.15,.75,0],.06,.025);box(h,M.leather,-.05,1.53,0,.7,.09,.48);return {root:h,legs}}
function makeRider(parent,uniform,hatColor,horseColor,style){const mount=makeHorse(parent,horseColor);const rider=group(parent,0,0,0);const saddle=box(rider,M.leather,-.08,1.63,0,.65,.1,.42);const torso=ball(rider,uniform,-.08,2.17,0,.34,.48,.25,1);box(rider,M.gold,-.08,2.42,.015,.58,.055,.28);box(rider,M.cream,-.08,1.78,0,.24,.28,.23);ball(rider,M.skin,-.08,2.72,0,.17,.2,.17,1);if(style==='russian'){const coat=box(rider,uniform,-.08,1.98,0,.56,.34,.32);coat.rotation.z=-.04;box(rider,M.gold,-.08,2.03,.17,.045,.32,.025);for(let i=0;i<4;i++)ball(rider,M.gold,-.22+i*.09,2.19,.17,.025,.025,.025,1);box(rider,M.black,-.08,2.91,0,.3,.12,.27);ball(rider,M.white,-.08,3.01,0,.12,.16,.12,1);limb(rider,uniform,[.16,2.38,0],[.45,2.6,.02],.09,.07);limb(rider,M.skin,[.45,2.6,.02],[.58,2.73,.02],.06,.045);sword(rider,.63,2.78,.02,1.15);limb(rider,uniform,[-.3,2.36,0],[-.46,2.02,.2]);}else{box(rider,M.gold,-.08,2.16,.17,.045,.4,.025);for(let i=0;i<5;i++)box(rider,M.gold,-.26+i*.09,2.35,.16,.035,.035,.035);box(rider,hatColor,-.08,2.94,0,.24,.16,.22);ball(rider,hatColor,-.08,3.07,0,.09,.16,.09);limb(rider,uniform,[.18,2.38,0],[.48,2.58,.02]);limb(rider,M.skin,[.48,2.58,.02],[.58,2.72,.02]);sword(rider,.64,2.77,.02,1.05);limb(rider,uniform,[-.3,2.36,0],[-.48,2.1,.18]);}
return {root:parent,legs:mount.legs,rider,horse:mount.root};}
function makeInfantry(){const root=group(scene);const body=group(root);box(body,M.red,0,1.45,0,.58,.72,.3);box(body,M.white,0,1.48,.16,.12,.7,.035);const strap1=box(body,M.white,0,1.48,.18,.08,.82,.035);strap1.rotation.z=-.68;const strap2=box(body,M.white,0,1.48,.18,.08,.82,.035);strap2.rotation.z=.68;box(body,M.black,-.18,.91,0,.12,.42,.14);box(body,M.black,.18,.91,0,.12,.42,.14);box(body,M.cream,0,1.03,0,.42,.16,.23);ball(body,M.skin,0,1.98,0,.17,.2,.17,1);box(body,M.black,0,2.18,0,.29,.09,.25);box(body,M.black,0,2.28,0,.22,.14,.2);box(body,M.gold,0,2.18,.13,.04,.1,.02);limb(body,M.red,[-.27,1.72,0],[-.48,1.25,.06]);limb(body,M.skin,[-.48,1.25,.06],[-.42,1.05,.1]);limb(body,M.red,[.27,1.72,0],[.43,1.42,.08]);limb(body,M.skin,[.43,1.42,.08],[.55,1.3,.1]);const musket=limb(body,M.leather,[.55,1.28,.12],[.7,2.45,.12],.035,.025);limb(body,M.steel,[.7,2.45,.12],[.76,2.82,.12],.018,.004);box(body,M.black,0,.1,0,.18,.2,.2);root.userData.anim=body;return root}
const models={};
models.player=group(scene);makeRider(models.player,M.navy,M.black,M.horse,'russian');
models.hussar=group(scene);makeRider(models.hussar,M.black,M.darkred,M.gray,'hussar');
models.british=makeInfantry();
const titles={player:['РУССКИЙ КАВАЛЕРИЙСКИЙ ОФИЦЕР','Игрок · гнедая лошадь · палаш'],british:['BRITISH WATERLOO INFANTRY','Противник · красный мундир · мушкет'],hussar:['ВРАЖЕСКИЙ ГУСАР','Кавалерия противника · сабля · серая лошадь']};
let selected='player';function select(key){selected=key;for(const k in models)models[k].visible=k===key;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.model===key));document.querySelector('#info').innerHTML='<b>'+titles[key][0]+'</b><br>'+titles[key][1];}
select('player');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>select(b.dataset.model)));
let down=false,lastX=0,rot=0,vel=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lastX;rot+=dx*.009;vel=dx*.0008;lastX=e.clientX});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointercancel',()=>down=false);
let t=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clockDelta(),.04);t+=dt;if(!down)rot+=vel,vel*=.96;const obj=models[selected];obj.rotation.y=rot;obj.position.y=Math.sin(t*2)*.025;if(selected!=='british'){const rider=obj.children.find(x=>x.isGroup&&x.children.length>5);if(rider)rider.rotation.z=Math.sin(t*3)*.012;}renderer.render(scene,camera)}let prev=performance.now();function clockDelta(){const n=performance.now(),d=(n-prev)/1000;prev=n;return d}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body></html>
