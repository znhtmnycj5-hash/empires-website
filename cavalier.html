<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кавалерист — ClanWars</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172015}body{touch-action:none;font-family:Georgia,serif}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#8faec1}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:4}
.panel{color:#f6e7bd;background:linear-gradient(#24201b,#11100e);border:2px solid #b08a3c;box-shadow:0 2px 10px #0008;border-radius:10px;padding:8px 13px;min-width:120px;text-shadow:0 2px 3px #000}.panel b{font-size:19px}.panel small{display:block;color:#d8c89f;font-size:11px;margin-top:2px}.center{min-width:180px;text-align:center}.bar{height:13px;border:2px solid #b08a3c;background:#17130f;border-radius:9px;overflow:hidden;margin-top:4px}.fill{height:100%;width:12%;background:linear-gradient(90deg,#172c88,#dce8ff,#b51e27)}
.buttons{position:absolute;z-index:5;right:18px;bottom:18px;display:flex;gap:12px}.btn{width:108px;height:78px;border-radius:18px;border:2px solid #d6ad58;background:linear-gradient(145deg,#292522,#0e0d0c);color:#f5e5bd;font-family:Georgia,serif;font-weight:bold;font-size:17px;box-shadow:0 5px 16px #0009,inset 0 0 0 2px #5c4725;display:flex;flex-direction:column;justify-content:center;align-items:center}.btn span{font-size:30px;line-height:30px}.btn:active,.btn.active{transform:scale(.94);filter:brightness(1.35)}
.help{position:absolute;z-index:4;left:16px;bottom:17px;color:#f4e8c6;background:#16130fbb;border:1px solid #b08a3c;border-radius:9px;padding:7px 10px;font-size:12px}
#message{position:absolute;z-index:6;left:50%;top:47%;transform:translate(-50%,-50%);color:#fff5d6;text-align:center;text-shadow:0 3px 6px #000;font-size:34px;font-weight:bold;opacity:0;transition:.15s;pointer-events:none;white-space:nowrap}#message.show{opacity:1}
#start{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#09080688,#090806cc)}.card{width:min(520px,90vw);padding:28px;border:2px solid #b08a3c;border-radius:18px;background:linear-gradient(145deg,#211d18,#0d0c0b);box-shadow:0 18px 60px #000b;color:#f6e7bd;text-align:center}.card h1{font-size:42px;margin:0 0 6px}.card p{color:#dbcda9;line-height:1.45}.startbtn{margin-top:12px;padding:15px 32px;border:2px solid #d5ad57;border-radius:12px;background:#292218;color:#f7e7bc;font:700 20px Georgia}
@media(max-width:700px){.panel{min-width:88px;padding:6px 9px}.panel b{font-size:15px}.center{min-width:120px}.buttons{right:10px;bottom:10px;gap:7px}.btn{width:92px;height:70px;font-size:14px}.btn span{font-size:26px}.help{display:none}.card h1{font-size:32px}}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas>
<div class="hud"><div class="panel"><b>⚔ <span id="score">0</span></b><small>ОЧКИ</small></div><div class="panel center"><small>ФРАНЦУЗСКАЯ КАВАЛЕРИЯ</small><div class="bar"><div id="progress" class="fill"></div></div></div><div class="panel"><b>🏆 <span id="best">0</span></b><small>РЕКОРД</small></div></div>
<div id="message"></div><div class="help">ПК: ЛКМ — удар · ПКМ — блок · SPACE — прыжок</div>
<div class="buttons"><button class="btn" data-act="attack"><span>⚔️</span>БИТЬ</button><button class="btn" data-act="block"><span>🛡️</span>БЛОК</button><button class="btn" data-act="jump"><span>⬆️</span>ПРЫЖОК</button></div>
<div id="start"><div class="card"><h1>КАВАЛЕРИСТ</h1><p>Французский драгун мчится через поле Наполеоновской битвы. Уничтожай британских солдат, блокируй удары всадников и перепрыгивай препятствия.</p><button class="startbtn" id="startBtn">НАЧАТЬ АТАКУ</button></div></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,playing=false,last=0,score=0,best=+localStorage.cavBest||0,speed=330,distance=0,spawn=0,bg=0,obstacles=[],dust=[];
const player={y:0,vy:0,onGround:true,attack:0,block:0};document.getElementById('best').textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function action(a){if(a==='jump'&&player.onGround){player.vy=-720;player.onGround=false}if(a==='attack')player.attack=.22;if(a==='block')player.block=.28}
document.querySelectorAll('.btn').forEach(b=>{const a=b.dataset.act;const d=e=>{e.preventDefault();b.classList.add('active');action(a)},u=e=>{e.preventDefault();b.classList.remove('active')};b.addEventListener('pointerdown',d);b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u)});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();action('jump')}});canvas.addEventListener('mousedown',e=>{if(e.button===0)action('attack');if(e.button===2)action('block')});canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('startBtn').onclick=()=>{document.getElementById('start').style.display='none';startGame()};
function startGame(){playing=true;score=0;distance=0;spawn=.5;speed=330;obstacles=[];player.y=0;player.vy=0;player.onGround=true;last=performance.now();requestAnimationFrame(loop)}
function say(t){const m=document.getElementById('message');m.textContent=t;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),450)}
function rand(a,b){return a+Math.random()*(b-a)}
function addObstacle(){const r=Math.random(),type=r<.38?'soldier':r<.62?'rider':r<.82?'fence':r<.94?'rock':'cliff';obstacles.push({x:W+100,type,hit:false})}
function drawBackground(){const h=H*.53;ctx.fillStyle='#8daec3';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff4';for(let i=0;i<5;i++){let x=((i*300-bg*.08)%(W+350))-100;ctx.beginPath();ctx.ellipse(x,100+i%2*60,90,28,0,0,7);ctx.fill()}ctx.fillStyle='#60754e';ctx.beginPath();ctx.moveTo(0,h+30);for(let x=0;x<=W;x+=80)ctx.lineTo(x,h-20-Math.sin(x*.009)*45);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();for(let i=0;i<7;i++){let x=((i*230-bg*.16)%(W+180))-80,y=h-30-(i%3)*30;ctx.fillStyle='#77756d35';ctx.beginPath();ctx.arc(x,y,30+i*4,0,7);ctx.arc(x+30,y-20,24+i*3,0,7);ctx.arc(x+55,y,28,0,7);ctx.fill()}ctx.fillStyle='#6c794a';ctx.fillRect(0,h+45,W,H-h);ctx.fillStyle='#7f8c57';ctx.beginPath();ctx.moveTo(0,h+55);for(let x=0;x<W;x+=35)ctx.lineTo(x,h+50+Math.sin(x*.04)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();for(let i=0;i<18;i++){let x=((i*150-bg*.42)%(W+200))-100,y=h+15+(i%4)*12;ctx.fillStyle=i%2?'#3a3830':'#7d2d26';ctx.fillRect(x,y,6,25);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(x+3,y);ctx.lineTo(x+3,y-18);ctx.stroke()}}
function drawHorse(x,y){ctx.save();ctx.translate(x,y+Math.sin(performance.now()/70)*2);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,36,58,10,0,0,7);ctx.fill();ctx.strokeStyle='#4b2a18';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,8);ctx.lineTo(-29,38);ctx.moveTo(18,8);ctx.lineTo(27,38);ctx.stroke();ctx.fillStyle='#6f3f22';ctx.beginPath();ctx.ellipse(0,-8,48,25,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(28,-20);ctx.quadraticCurveTo(44,-48,61,-38);ctx.quadraticCurveTo(68,-32,61,-24);ctx.lineTo(35,-10);ctx.fill();ctx.fillStyle='#251810';ctx.beginPath();ctx.moveTo(52,-42);ctx.quadraticCurveTo(48,-60,39,-50);ctx.quadraticCurveTo(52,-58,58,-45);ctx.fill();ctx.fillStyle='#172b58';ctx.fillRect(-22,-28,35,12);ctx.strokeStyle='#d1a74d';ctx.lineWidth=2;ctx.strokeRect(-22,-28,35,12);ctx.fillStyle='#183d78';ctx.beginPath();ctx.roundRect(-7,-57,23,31,5);ctx.fill();ctx.fillStyle='#f0c9a2';ctx.beginPath();ctx.arc(5,-64,10,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-5,-76,20,12);ctx.fillStyle='#d32c28';ctx.fillRect(7,-84,5,9);ctx.strokeStyle='#183d78';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(9,-51);ctx.lineTo(26,-40);ctx.stroke();ctx.strokeStyle='#d8d8cf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(25,-40);ctx.lineTo(58,-65);ctx.stroke();ctx.restore()}
function drawEnemy(o){const x=o.x,y=H*.69;ctx.save();ctx.translate(x,y);if(o.type==='soldier'){ctx.fillStyle='#7e2723';ctx.fillRect(-9,-55,18,35);ctx.fillStyle='#e5c7a4';ctx.beginPath();ctx.arc(0,-64,9,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-10,-76,20,10);ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(5,-60);ctx.lineTo(8,-104);ctx.stroke()}else if(o.type==='rider'){ctx.fillStyle='#d7d7d1';ctx.beginPath();ctx.ellipse(0,-12,34,17,0,0,7);ctx.fill();ctx.fillStyle='#8e8e86';ctx.beginPath();ctx.arc(23,-38,9,0,7);ctx.fill();ctx.fillStyle='#a52c26';ctx.fillRect(13,-55,20,10);ctx.strokeStyle='#ddd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,-35);ctx.lineTo(-7,-62);ctx.stroke()}else if(o.type==='fence'){ctx.strokeStyle='#5d3c20';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-38,15);ctx.lineTo(-38,-34);ctx.moveTo(38,15);ctx.lineTo(38,-34);ctx.stroke();ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-45,-18);ctx.lineTo(45,-18);ctx.moveTo(-45,-2);ctx.lineTo(45,-2);ctx.stroke()}else if(o.type==='rock'){ctx.fillStyle='#69675d';ctx.beginPath();ctx.moveTo(-35,15);ctx.lineTo(-25,-20);ctx.lineTo(0,-34);ctx.lineTo(30,-14);ctx.lineTo(38,15);ctx.closePath();ctx.fill()}else{ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(-65,15);ctx.lineTo(65,15);ctx.lineTo(65,-8);ctx.lineTo(25,-8);ctx.lineTo(0,-45);ctx.lineTo(-25,-8);ctx.lineTo(-65,-8);ctx.closePath();ctx.fill()}ctx.restore()}
function loop(now){if(!playing)return;const dt=Math.min((now-last)/1000,.033);last=now;distance+=speed*dt;bg+=speed*dt;speed+=dt*2;player.vy+=1900*dt;player.y+=player.vy*dt;if(player.y>=0){player.y=0;player.vy=0;player.onGround=true}player.attack=Math.max(0,player.attack-dt);player.block=Math.max(0,player.block-dt);spawn-=dt;if(spawn<=0){addObstacle();spawn=rand(.75,1.45)-Math.min(.35,(speed-330)/900)}for(const d of dust){d.x-=speed*dt;d.life-=dt}dust=dust.filter(d=>d.life>0);if(Math.random()<dt*18)dust.push({x:W*.22+rand(-20,30),y:H*.72+rand(-4,10),life:.5});for(const o of obstacles){o.x-=speed*dt;const px=W*.25;if(!o.hit&&Math.abs(o.x-px)<48){if(o.type==='soldier'&&player.attack>0){o.hit=true;score+=100;say('+100')}else if(o.type==='rider'&&player.block>0){o.hit=true;score+=150;say('БЛОК! +150')}else if((o.type==='fence'||o.type==='rock'||o.type==='cliff')&&player.y<-35){o.hit=true;score+=100}else if(o.type==='rider'&&player.attack>0){o.hit=true;score+=120}else if(!o.hit){gameOver();return}}}obstacles=obstacles.filter(o=>o.x>-120&&!o.hit);document.getElementById('score').textContent=score;document.getElementById('progress').style.width=(12+(distance/3000)*76)%100+'%';draw();requestAnimationFrame(loop)}
function draw(){drawBackground();for(const d of dust){ctx.fillStyle='#c7b89499';ctx.beginPath();ctx.arc(d.x,d.y,5,0,7);ctx.fill()}obstacles.forEach(drawEnemy);drawHorse(W*.25,H*.69+player.y);if(player.attack>0){ctx.strokeStyle='#fff1a6';ctx.lineWidth=5;ctx.beginPath();ctx.arc(W*.25+30,H*.69+player.y-35,55,-1.8,.3);ctx.stroke()}if(player.block>0){ctx.strokeStyle='#b8d8ff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(W*.25,H*.69+player.y-45,38,-1.7,1.2);ctx.stroke()}}
function gameOver(){playing=false;best=Math.max(best,score);localStorage.cavBest=best;document.getElementById('best').textContent=best;const m=document.getElementById('message');m.innerHTML='АТАКА ОКОНЧЕНА<br><small>Очки: '+score+'</small>';m.classList.add('show');setTimeout(()=>{m.classList.remove('show');document.getElementById('start').style.display='flex';document.querySelector('.card p').textContent='Атака закончена. Попробуй побить свой рекорд.'},900)}
</script>
</body></html>
