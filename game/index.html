<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17130f"><title>Последнее письмо</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#17130f;color:#f1e4c8;font-family:Georgia,serif}.scene{position:relative;width:100%;height:100vh;height:100dvh;min-height:0;overflow:hidden;display:grid;place-items:center;background:linear-gradient(90deg,#100d0bea 0%,#211810a8 48%,#17120c55 100%),url('assets/menu-scene.svg') center/cover no-repeat;transition:transform 5s ease,filter 3s}.scene:after{content:"";position:absolute;inset:14px;border:1px solid #b8955577;pointer-events:none}.scene.zoom{transform:scale(1.12);filter:brightness(.55)}.menu{z-index:2;width:min(430px,88vw);margin:36px auto 36px 8%;text-align:center;padding:30px 28px;background:#100d0be8;border:1px solid #b89555;box-shadow:0 12px 50px #0009;transition:opacity 1.5s}.menu.fade{opacity:0}.kicker{letter-spacing:.3em;text-transform:uppercase;color:#d5b879;font-size:11px;margin-bottom:16px}h1{font-weight:normal;font-size:clamp(40px,5vw,66px);line-height:1.02;color:#e3c27c;text-shadow:0 3px 12px #000;margin:0 0 12px}.subtitle{font-style:italic;color:#e8dcc4;font-size:15px;line-height:1.5;margin:0 auto 25px}.rule{height:1px;background:linear-gradient(90deg,transparent,#b89555,transparent);margin:0 auto 20px;width:85%}button{display:block;width:100%;margin:10px 0;padding:13px 16px;background:linear-gradient(#263747,#172531);border:1px solid #b89555;color:#f1dfb8;font:17px Georgia,serif;cursor:pointer;transition:.2s}button:hover{background:#3b4c58;border-color:#f0d18b;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.note{margin-top:20px;font-size:11px;letter-spacing:.16em;color:#d6c39e}.panel{display:none;margin-top:14px;padding:15px;background:#17130f;border:1px solid #b89555;text-align:left;line-height:1.5}.panel.show{display:block}.panel button{font-size:15px;padding:9px}.settings-row{display:flex;align-items:center;gap:9px;margin:10px 0}.settings-row input{accent-color:#b89555}.transition{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#080706;opacity:0;pointer-events:none;transition:opacity 2s;color:#e3c27c;font-size:clamp(25px,5vw,48px);font-style:italic;text-align:center}.transition.show{opacity:1}@media(max-width:700px){.scene{background-position:center center}.menu{margin:0 auto;align-self:center;padding:clamp(10px,3vh,22px) clamp(14px,4vw,22px);width:min(390px,88vw);max-height:94dvh;overflow:auto}h1{font-size:clamp(27px,6vh,42px);margin-bottom:8px}.kicker{font-size:clamp(8px,1.7vh,11px);margin-bottom:8px}.subtitle{font-size:clamp(11px,2.2vh,14px);margin-bottom:clamp(8px,2vh,18px)}.rule{margin-bottom:clamp(7px,1.5vh,14px)}button{padding:clamp(7px,1.7vh,12px);font-size:clamp(13px,2.5vh,16px);margin:clamp(5px,1.1vh,8px) 0}.note{margin-top:clamp(8px,1.7vh,14px);font-size:9px}.panel{padding:10px;font-size:12px}}@media(max-width:700px) and (orientation:landscape){.scene{background-position:center 54%}.menu{width:min(360px,46vw);max-height:90dvh;margin-left:4vw;padding:clamp(7px,2vh,15px) clamp(12px,2vw,20px)}h1{font-size:clamp(24px,6vh,36px)}.subtitle{font-size:clamp(10px,2.4vh,13px);margin-bottom:6px}button{padding:clamp(5px,1.5vh,9px);margin:4px 0;font-size:clamp(12px,2.5vh,15px)}.note{margin-top:6px}.rule{margin-bottom:6px}}
</style></head><body><main class="scene" id="scene"><section class="menu" id="menu"><div class="kicker">Исторический роман</div><h1>Последнее<br>письмо</h1><p class="subtitle">История о дружбе, чести и цене войны</p><div class="rule"></div><button onclick="beginStory()">Новая история</button><button disabled title="Сохранений пока нет">Продолжить</button><button onclick="panel('settings')">Настройки</button><button onclick="panel('exit')">Выход</button><div class="note">ФРАНЦИЯ · 1809</div><div id="settings" class="panel"><label class="settings-row"><input id="musicToggle" type="checkbox" checked onchange="toggleAmbience(this.checked)"> Атмосферный звук</label><label class="settings-row"><input id="fireToggle" type="checkbox" checked onchange="toggleFire(this.checked)"> Потрескивание камина</label><p>Звук создаётся браузером и не требует загрузки аудиофайлов.</p><button onclick="hide()">Готово</button></div><div id="exit" class="panel">Это браузерная версия меню. Закройте вкладку, чтобы выйти.<button onclick="hide()">Вернуться</button></div></section></main><div class="transition" id="transition">За несколько лет до этого…</div>
<script>
let audioCtx=null,windGain=null,fireGain=null,windSource=null,fireSource=null,ambienceOn=true,fireOn=true;
function noise(ctx){const b=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;s.loop=true;return s}
function startAmbience(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();const wind=noise(audioCtx),windFilter=audioCtx.createBiquadFilter();windFilter.type='lowpass';windFilter.frequency.value=420;windGain=audioCtx.createGain();windGain.gain.value=ambienceOn?.025:0;wind.connect(windFilter).connect(windGain).connect(audioCtx.destination);wind.start();windSource=wind;const fire=noise(audioCtx),fireFilter=audioCtx.createBiquadFilter();fireFilter.type='lowpass';fireFilter.frequency.value=850;fireGain=audioCtx.createGain();fireGain.gain.value=fireOn?.012:0;fire.connect(fireFilter).connect(fireGain).connect(audioCtx.destination);fire.start();fireSource=fire}
function toggleAmbience(v){ambienceOn=v;if(audioCtx&&windGain)windGain.gain.setTargetAtTime(v?.025:0,audioCtx.currentTime,.3)}
function toggleFire(v){fireOn=v;if(audioCtx&&fireGain)fireGain.gain.setTargetAtTime(v?.012:0,audioCtx.currentTime,.3)}
function panel(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show')}
function hide(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'))}
function beginStory(){startAmbience();if(audioCtx.state==='suspended')audioCtx.resume();hide();document.getElementById('scene').classList.add('zoom');document.getElementById('menu').classList.add('fade');setTimeout(()=>document.getElementById('transition').classList.add('show'),1700)}
document.addEventListener('pointerdown',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()},{once:true});
</script></body></html>
