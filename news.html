const params=new URLSearchParams(location.search);
const newsPage=Math.max(1,parseInt(params.get('page')||'1',10)||1);
const regiment=params.get('regiment')||'1st Regiment';
const id=params.get('id')||'';
const d=regimentData[regiment]||regimentData['1st Regiment'];
const samples=(newsTemplates[regiment]||newsTemplates['1st Regiment']).map((n,i)=>({id:'sample-'+(i+1),regiment,title:n[0],date:n[1],author:n[2],privacy:n[3],body:n[4],image:n[5],private:n[6]}));
const storageKey='empire_regiment_news_v1_'+regiment;
const commentsKey='empire_news_comments_v1';
const getStored=()=>{try{const value=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(value)?value.filter(n=>n&&typeof n==='object').map((n,i)=>({id:String(n.id||('recovered-'+i)),regiment:n.regiment||regiment,title:String(n.title||'Без названия'),date:String(n.date||''),author:String(n.author||'Командование'),privacy:n.privacy|| (n.private?'Приватная':'Открытая'),private:n.private===true||n.privacy==='Приватная',body:String(n.body||''),image:String(n.image||d.avatar)})):[];}catch(e){return[];}};
const getComments=()=>{try{return JSON.parse(localStorage.getItem(commentsKey)||'{}')||{};}catch(e){return{};}};
const saveStored=v=>localStorage.setItem(storageKey,JSON.stringify(v));
const currentUser=(()=>{try{const value=JSON.parse(localStorage.getItem('empire_current_user')||'null');return value&&typeof value==='object'?{name:String(value.name||'Гость'),regiment:String(value.regiment||''),role:String(value.role||'user')}:{name:'Гость',regiment:'',role:'user'};}catch(e){return{name:'Гость',regiment:'',role:'user'};}})();
const isMember=currentUser.regiment===regiment;
const isOfficer=isMember&&(currentUser.role==='officer'||currentUser.role==='commander');
const likesStorageKey='empire-comment-likes-v1';
const getLikeMap=()=>{try{return JSON.parse(localStorage.getItem(likesStorageKey)||'{}')||{};}catch(e){return{};}};
const getLikes=key=>{const value=getLikeMap()[key];return Array.isArray(value)?value:[];};
const toggleLike=key=>{const map=getLikeMap(),names=Array.isArray(map[key])?map[key]:[],index=names.indexOf(currentUser.name);if(index>=0)names.splice(index,1);else names.push(currentUser.name);map[key]=names;localStorage.setItem(likesStorageKey,JSON.stringify(map));};

const newsDateValue=value=>{const parts=String(value||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(parts)return new Date(Number(parts[3]),Number(parts[2])-1,Number(parts[1])).getTime()||0;const parsed=Date.parse(value||'');return Number.isFinite(parsed)?parsed:0;};
const allNews=()=>[...getStored(),...samples].sort((a,b)=>newsDateValue(b.date)-newsDateValue(a.date));
const escapeHtml=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('backToRegiment').href='regiment.html?name='+encodeURIComponent(regiment);
function renderList(){
  const visible=allNews().filter(n=>!n.private||isMember);
  if(!id){
    const totalPages=Math.max(1,Math.ceil(visible.length/20));
    const safePage=Math.min(newsPage,totalPages);
    const pageItems=visible.slice((safePage-1)*20,safePage*20);
    const pageLinks=totalPages>1?'<div class="news-pagination">'+(safePage>1?'<a href="news.html?regiment='+encodeURIComponent(regiment)+'&page='+(safePage-1)+'">‹</a>':'')+Array.from({length:totalPages},(_,i)=>'<a href="news.html?regiment='+encodeURIComponent(regiment)+'&page='+(i+1)+'" class="'+(i+1===safePage?'current':'')+'">'+(i+1)+'</a>').join('')+(safePage<totalPages?'<a href="news.html?regiment='+encodeURIComponent(regiment)+'&page='+(safePage+1)+'">›</a>':'')+'</div>':'';
    document.getElementById('newsDetail').innerHTML='<div class="news-list-head"><div><div class="page-kicker">НОВОСТИ ПОЛКА</div><h1>'+escapeHtml(regiment)+'</h1><p>'+escapeHtml(d.faction)+' · '+visible.length+' публикаций</p></div><a class="btn primary" href="news.html?regiment='+encodeURIComponent(regiment)+'&create=1" '+(isOfficer?'':'hidden')+'>+ Создать новость</a></div><div class="regiment-news-list news-full-list">'+pageItems.map(n=>'<a class="regiment-news-item news-clickable" href="news.html?regiment='+encodeURIComponent(regiment)+'&id='+encodeURIComponent(n.id)+'"><img src="'+n.image+'" alt="" loading="lazy" decoding="async"><div class="regiment-news-body"><div class="regiment-news-date">'+n.date+' · '+(n.private?'🔒 Приватная':'🌐 Открытая')+'</div><h3>'+escapeHtml(n.title)+'</h3><p>'+escapeHtml(n.body)+'</p><small>Автор: '+escapeHtml(n.author)+'</small><span class="preview-comment-count" aria-label="Комментарии: '+(window.EMPIRE_COMMENT_COUNTS&&typeof window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount==='function'?window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount(n.id):0)+'"><span class=\"preview-comment-icon\" aria-hidden=\"true\">💬</span> <span>'+(window.EMPIRE_COMMENT_COUNTS&&typeof window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount==='function'?window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount(n.id):0)+'</span></span></div></a>').join('')+'</div>'+pageLinks;
    document.getElementById('commentsSection').hidden=true;
    return;
  }
  let news=allNews().find(n=>String(n.id)===String(id));
  // Восстанавливаем демонстрационную публикацию по её sample-N ID, если ссылка ведёт на старый индекс.
  if(!news){
    const sampleMatch=String(id).match(/^sample-(\d+)$/);
    const sampleIndex=sampleMatch?Number(sampleMatch[1])-1:-1;
    const template=(newsTemplates[regiment]||newsTemplates['1st Regiment'])[sampleIndex];
    if(template)news={id,regiment,title:template[0],date:template[1],author:template[2],privacy:template[3],body:template[4],image:template[5],private:template[6]};
  }
  if(!news){document.getElementById('newsDetail').innerHTML='<div class="empty-note">Эта публикация больше недоступна. Вернитесь в архив и откройте другую новость.</div>';document.getElementById('commentsSection').hidden=true;return;}
  if(news.private&&!isMember){
    document.getElementById('newsDetail').innerHTML='<div class="empty-note">🔒 Эта новость приватная. Она доступна только участникам полка <strong>'+escapeHtml(regiment)+'</strong>.</div>';
    document.getElementById('commentsSection').hidden=true;
    return;
  }
  document.getElementById('newsDetail').innerHTML='<div class="news-detail-head"><div><div class="page-kicker">НОВОСТЬ ПОЛКА</div><h1>'+escapeHtml(news.title||'Новости полка')+'</h1><div class="news-meta">'+escapeHtml(news.date||'')+' · '+escapeHtml(news.author||'Командование')+' · '+(news.private?'🔒 Только для членов полка':'🌐 Открытая')+'</div></div><a class="btn" href="news.html?regiment='+encodeURIComponent(regiment)+'">← Все новости</a></div>'+(news.image?'<img class="news-cover" src="'+escapeHtml(news.image)+'" alt="" loading="lazy" decoding="async">':'')+'<div class="news-content">'+(news.body||'<p>Подробности этой публикации пока не добавлены.</p>')+'</div>';
  document.getElementById('commentsSection').hidden=false;renderComments(news);
}
const reportComment=(commentId,commentText,author)=>{
  const key='empire_comment_reports_v1';
  let reports=[];try{reports=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  const duplicate=reports.some(r=>r.status==='pending'&&r.location==='news.html?regiment='+regiment+'#'+news.id&&String(r.commentId)===String(commentId)&&r.reporter===currentUser.name);
  if(duplicate){alert('Вы уже пожаловались на этот комментарий.');return;}
  reports.push({id:'comment-report-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),status:'pending',reporter:currentUser.name,target:author,location:'news.html?regiment='+regiment+'#'+news.id,commentId:String(commentId),comment:String(commentText||''),reason:'Жалоба пользователя',createdAt:new Date().toISOString()});
  localStorage.setItem(key,JSON.stringify(reports));
  alert('Жалоба отправлена модераторам.');
};


const escapeRichComment=value=>String(value??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const cleanRichComment=html=>{
 const doc=new DOMParser().parseFromString(String(html||""),"text/html"),allowed=new Set(["B","STRONG","I","EM","U","BLOCKQUOTE","BR","SPAN","IMG","VIDEO","AUDIO","DETAILS","SUMMARY"]);
 const safeUrl=value=>{try{const u=new URL(String(value||""),location.href);return ["http:","https:"].includes(u.protocol)?u.href:"";}catch(e){return "";}};
 const walk=node=>[...node.childNodes].forEach(ch=>{
  if(ch.nodeType===Node.TEXT_NODE)return;
  if(ch.nodeType!==Node.ELEMENT_NODE||!allowed.has(ch.tagName)){const p=ch.parentNode;if(p){while(ch.firstChild)p.insertBefore(ch.firstChild,ch);p.removeChild(ch);}return;}
  const originalSrc=ch.getAttribute("src"),isSpoiler=ch.dataset.spoiler==="true";
  [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
  if(ch.tagName==="IMG"||ch.tagName==="VIDEO"||ch.tagName==="AUDIO"){const src=safeUrl(originalSrc);if(!src){ch.remove();return;}ch.setAttribute("src",src);if(ch.tagName==="IMG"){ch.setAttribute("alt","Вставленная картинка");ch.setAttribute("loading","lazy");}else{ch.setAttribute("controls","");ch.setAttribute("preload","metadata");}}
  if(ch.tagName==="SPAN"&&!isSpoiler){ch.replaceWith(...ch.childNodes);return;}
  if(ch.tagName==="SPAN"&&isSpoiler)ch.setAttribute("data-spoiler","true");walk(ch);
 });walk(doc.body);return doc.body.innerHTML;
};
const richCommentHtml=c=>c.html?cleanRichComment(c.html):escapeRichComment(c.text||"").replace(/\n/g,"<br>");
const bindRichEditor=(form,editor)=>{
 const toolbar=form.querySelector(".battle-comment-toolbar");let savedRange=null;
 editor.addEventListener("keyup",save);editor.addEventListener("mouseup",save);editor.addEventListener("input",save);
 function save(){const sel=getSelection();if(sel&&sel.rangeCount&&editor.contains(sel.anchorNode))savedRange=sel.getRangeAt(0).cloneRange();}
 function restore(){editor.focus();const sel=getSelection();if(savedRange){sel.removeAllRanges();sel.addRange(savedRange);}else{const r=document.createRange();r.selectNodeContents(editor);r.collapse(false);sel.removeAllRanges();sel.addRange(r);}}
 function insert(html){restore();document.execCommand("insertHTML",false,html);save();}
 toolbar.addEventListener("mousedown",e=>{if(e.target.closest("[data-editor-command]"))e.preventDefault();});
 toolbar.addEventListener("click",e=>{const b=e.target.closest("[data-editor-command]");if(!b)return;const cmd=b.dataset.editorCommand;restore();
  if(["bold","italic","underline"].includes(cmd))document.execCommand(cmd,false,null);
  else if(cmd==="quote")document.execCommand("formatBlock",false,"blockquote");
  else if(cmd==="spoiler"){const sel=getSelection(),txt=sel&&sel.toString();insert('<span data-spoiler="true">'+(txt?escapeRichComment(txt):"Спойлер")+'</span>');}
  else if(cmd==="image"){const url=prompt("Вставьте прямую ссылку на картинку:");if(url&&/^https?:\/\//i.test(url.trim()))insert('<img src="'+escapeRichComment(url.trim())+'" alt="Вставленная картинка" loading="lazy" decoding="async">');}
  else if(cmd==="video"){const url=prompt("Вставьте прямую ссылку на видео:");if(url&&/^https?:\/\//i.test(url.trim()))insert('<video src="'+escapeRichComment(url.trim())+'" controls preload="metadata"></video>');}
  save();
 });
};
const richToolbarHtml='<div class="battle-comment-toolbar" role="toolbar" aria-label="Форматирование комментария"><button type="button" data-editor-command="bold" title="Жирный"><strong>B</strong></button><button type="button" data-editor-command="italic" title="Курсив"><em>I</em></button><button type="button" data-editor-command="underline" title="Подчёркивание"><u>U</u></button><button type="button" data-editor-command="quote" title="Цитата">❝</button><button type="button" data-editor-command="spoiler" title="Спойлер">S</button><button type="button" data-editor-command="image" title="Вставить картинку">▧</button><button type="button" data-editor-command="video" title="Вставить видео">▶</button></div>';
const commentRegiments={};
const commentPresence=()=>{try{const value=JSON.parse(localStorage.getItem('empire_profile_presence_v1')||'{}');return value&&typeof value==='object'?value:{}}catch(e){return {}}};
const ensureTestComments=news=>{if(String(news.id)!=='sample-4')return;const map=getComments(),items=Array.isArray(map[news.id])?map[news.id]:[],clean=items.filter(x=>!/^sample-4-(comment|reply)-\d+$/.test(String(x.id||'')));if(clean.length!==items.length){map[news.id]=clean;localStorage.setItem(commentsKey,JSON.stringify(map));}};

const commentAuthorMeta=name=>{const regiment=commentRegiments[name]||'Без полка',last=commentPresence()[name],online=typeof last==='number'&&Date.now()-last<5*60*1000;return {regiment,online};};
function renderComments(news){
 ensureTestComments(news);
 const map=getComments(),comments=Array.isArray(map[news.id])?map[news.id]:[];
  const card=(c,depth=0)=>{
  const author=String(c.author||c.name||"Пользователь"),cid=String(c.id||""),kids=comments.filter(x=>String(x.parentId||"")===cid);
  const meta=commentAuthorMeta(author),regimentName=String(c.regiment||meta.regiment||"");
  const status='<span class="battle-comment-presence '+(meta.online?'is-online':'is-offline')+'"><i></i>'+(meta.online?'В сети':'Не в сети')+'</span>';
  const likes=getLikes("news:"+news.id+":"+cid),preview=likes.slice(0,2).map(escapeHtml).join(", ");
  const like='<div class="comment-reactions"><button class="comment-like-button'+(likes.includes(currentUser.name)?" is-liked":"")+'" type="button" data-like-comment="'+escapeHtml(cid)+'">♥ <span>Нравится</span> <b>'+likes.length+'</b></button>'+(likes.length?'<div class="comment-like-popover"><span class="comment-like-preview">'+preview+'</span><button type="button" class="comment-like-all" data-show-likes="'+escapeHtml(cid)+'">Посмотреть всех</button><div class="comment-like-full" hidden>'+likes.map(x=>'<a href="'+empireProfileUrl(x)+'">'+escapeHtml(x)+'</a>').join("")+'</div></div>':"")+'</div>';
  const own=author===currentUser.name?'<button class="comment-delete-button" type="button" data-delete-comment="'+escapeHtml(cid)+'">Удалить</button>':"";
  return '<article class="battle-thread-item'+(depth?' is-reply':'')+'" data-comment-id="'+escapeHtml(cid)+'"><div class="battle-comment"><div class="battle-comment-author"><a class="battle-comment-avatar-link" href="'+empireProfileUrl(author)+'"><img class="battle-comment-avatar" src="'+escapeHtml(((window.EMPIRE_USER_AVATARS&&window.EMPIRE_USER_AVATARS[author])||"")||empireUserAvatar(author,"",window.EMPIRE_USER_FACTIONS&&window.EMPIRE_USER_FACTIONS[author]))+'" alt="'+escapeHtml(author)+'" loading="lazy"></a><div class="battle-comment-identity"><div class="battle-comment-head"><a href="'+empireProfileUrl(author)+'"><strong>'+escapeHtml(author)+'</strong></a></div>'+(regimentName?'<div class="battle-comment-regiment">'+escapeHtml(regimentName)+'</div>':"")+status+'<span class="battle-comment-time">'+escapeHtml(c.date||"")+'</span></div></div><div class="battle-comment-content"><div class="battle-comment-text">'+richCommentHtml(c)+'</div>'+like+'<button class="comment-report-button" type="button" data-report-comment="'+escapeHtml(cid)+'">⚑ Пожаловаться</button>'+own+'<button class="battle-reply-button" type="button" data-reply-to="'+escapeHtml(cid)+'">Ответить</button><form class="battle-reply-form" data-parent-id="'+escapeHtml(cid)+'" hidden><input type="text" maxlength="500" placeholder="Ответить '+escapeHtml(author)+'…" required><button type="submit">Ответить</button></form></div></div>'+(kids.length?'<div class="battle-thread-replies">'+kids.map(x=>card(x,depth+1)).join("")+'</div>':"")+'</article>';
 };
 const roots=comments.filter(c=>!c.parentId||!comments.some(p=>String(p.id)===String(c.parentId)));
 const html=roots.map(c=>card(c)).join("")||'<div class="battle-comments-empty">Комментариев пока нет.</div>';
 const box=document.getElementById("commentsSection");
 box.innerHTML='<div class="card-title">💬 Комментарии <span class="battle-comment-count">'+comments.length+'</span></div><div class="battle-comments" id="newsCommentList">'+html+'</div><form id="commentForm" class="battle-comment-form"><div class="battle-comment-editor">'+richToolbarHtml+'<div id="newsCommentInput" class="battle-comment-input" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Написать комментарий…"></div></div><button type="submit">Отправить</button></form>';
 const list=box.querySelector("#newsCommentList"),form=box.querySelector("#commentForm"),editor=box.querySelector("#newsCommentInput");
 bindRichEditor(form,editor);
 const saveComment=item=>{if(!window.EMPIRE_AUTH?.user){document.querySelector("a.login")?.click();alert("Для отправки комментария войдите в аккаунт.");return;}const latest=getComments(),items=Array.isArray(latest[news.id])?latest[news.id]:[];items.push(item);latest[news.id]=items;localStorage.setItem(commentsKey,JSON.stringify(latest));renderComments(news);if(window.EMPIRE_COMMENTS)window.EMPIRE_COMMENTS.create("regiment_news",news.id,{text:item.text,html:item.html,parentId:item.parentId}).then(remote=>{Object.assign(item,remote);latest[news.id]=items;localStorage.setItem(commentsKey,JSON.stringify(latest));renderComments(news);}).catch(err=>alert(err.message||"Не удалось сохранить комментарий в общей базе."));};
 list.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.likeComment){toggleLike("news:"+news.id+":"+b.dataset.likeComment);renderComments(news);}
  else if(b.dataset.showLikes){const p=b.parentElement.querySelector(".comment-like-full");if(p)p.hidden=!p.hidden;}
  else if(b.dataset.reportComment){const c=b.closest("[data-comment-id]");reportComment(b.dataset.reportComment,c?.querySelector(".battle-comment-text")?.textContent||"",c?.querySelector(".battle-comment-head strong")?.textContent||"Пользователь");}
  else if(b.dataset.deleteComment){const target=comments.find(x=>String(x.id)===b.dataset.deleteComment);if(target&&String(target.author||target.name)===currentUser.name&&confirm("Удалить этот комментарий?")){const next=comments.filter(x=>String(x.id)!==b.dataset.deleteComment);next.forEach(x=>{if(x.parentId===b.dataset.deleteComment)delete x.parentId;});const latest=getComments();latest[news.id]=next;localStorage.setItem(commentsKey,JSON.stringify(latest));renderComments(news);}}
  else if(b.dataset.replyTo){const f=b.closest(".battle-thread-item")?.querySelector(":scope > .battle-comment .battle-reply-form");if(f){f.hidden=!f.hidden;if(!f.hidden)f.querySelector("input").focus();}}
 });
 list.addEventListener("submit",e=>{const f=e.target.closest(".battle-reply-form");if(!f)return;e.preventDefault();const input=f.querySelector("input"),value=input.value.trim();if(!value)return;saveComment({id:"comment-"+Date.now(),parentId:f.dataset.parentId,author:currentUser.name,avatar:empireUserAvatar(currentUser.name),date:new Date().toLocaleString("ru-RU"),text:value});});
 form.addEventListener("submit",e=>{e.preventDefault();const html=cleanRichComment(editor.innerHTML),textValue=editor.textContent.trim();if(!textValue&&!html.replace(/<[^>]*>/g,"").trim())return;saveComment({id:"comment-"+Date.now(),author:currentUser.name,avatar:empireUserAvatar(currentUser.name),date:new Date().toLocaleString("ru-RU"),html,text:textValue});});
}

  });

else renderList();
