const params=new URLSearchParams(location.search);
const newsPage=Math.max(1,parseInt(params.get('page')||'1',10)||1);
const regiment=params.get('regiment')||'1st Regiment';
const id=params.get('id')||'';
const d=regimentData[regiment]||regimentData['1st Regiment'];
const samples=(newsTemplates[regiment]||newsTemplates['1st Regiment']).map((n,i)=>({id:'sample-'+(i+1),regiment,title:n[0],date:n[1],author:n[2],privacy:n[3],body:n[4],image:n[5],private:n[6]}));
const storageKey='empire_regiment_news_v1_'+regiment;
const commentsKey='empire_news_comments_v1';
const getStored=()=>{try{const value=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(value)?value.filter(n=>n&&typeof n==='object').map((n,i)=>({id:String(n.id||('recovered-'+i)),regiment:n.regiment||regiment,title:String(n.title||'Без названия'),date:String(n.date||''),author:String(n.author||'Командование'),privacy:n.privacy|| (n.private?'Приватная':'Открытая'),private:n.private===true||n.privacy==='Приватная',body:String(n.body||''),image:String(n.image||d.avatar)})):[];}catch(e){return[];}};
const getComments=()=>{try{return JSON.parse(localStorage.getItem(commentsKey)||'{}')||{};}catch(e){return{};}};
const saveStored=v=>localStorage.setItem(storageKey,JSON.stringify(v));
const currentUser=(()=>{try{const value=JSON.parse(localStorage.getItem('empire_current_user')||'null');return value&&typeof value==='object'?{name:String(value.name||'Ankord'),regiment:String(value.regiment||''),role:String(value.role||'user')}:{name:'Ankord',regiment:'1st Regiment',role:'commander'};}catch(e){return{name:'Ankord',regiment:'1st Regiment',role:'commander'};}})();
const isMember=currentUser.regiment===regiment;
const isOfficer=isMember&&(currentUser.role==='officer'||currentUser.role==='commander');
const likesStorageKey='empire-comment-likes-v1';
const getLikeMap=()=>{try{return JSON.parse(localStorage.getItem(likesStorageKey)||'{}')||{};}catch(e){return{};}};
const getLikes=key=>{const value=getLikeMap()[key];return Array.isArray(value)?value:[];};
const toggleLike=key=>{const map=getLikeMap(),names=Array.isArray(map[key])?map[key]:[],index=names.indexOf(currentUser.name);if(index>=0)names.splice(index,1);else names.push(currentUser.name);map[key]=names;localStorage.setItem(likesStorageKey,JSON.stringify(map));};

const newsDateValue=value=>{const parts=String(value||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(parts)return new Date(Number(parts[3]),Number(parts[2])-1,Number(parts[1])).getTime()||0;const parsed=Date.parse(value||'');return Number.isFinite(parsed)?parsed:0;};
const allNews=()=>[...getStored(),...samples].sort((a,b)=>newsDateValue(b.date)-newsDateValue(a.date));
const escapeHtml=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('backToRegiment').href='regiment.html?name='+encodeURIComponent(regiment);
function renderList(){
  const visible=allNews().filter(n=>!n.private||isMember);
  if(!id){
    const totalPages=Math.max(1,Math.ceil(visible.length/20));
    const safePage=Math.min(newsPage,totalPages);
    const pageItems=visible.slice((safePage-1)*20,safePage*20);
    const pageLinks=totalPages>1?'<div class="news-pagination">'+(safePage>1?'<a href="news.html?regiment='+encodeURIComponent(regiment)+'&page='+(safePage-1)+'">‹</a>':'')+Array.from({length:totalPages},(_,i)=>'<a href="news.html?regiment='+encodeURIComponent(regiment)+'&page='+(i+1)+'" class="'+(i+1===safePage?'current':'')+'">'+(i+1)+'</a>').join('')+(safePage<totalPages?'<a href="news.html?regiment='+encodeURIComponent(regiment)+'&page='+(safePage+1)+'">›</a>':'')+'</div>':'';
    document.getElementById('newsDetail').innerHTML='<div class="news-list-head"><div><div class="page-kicker">НОВОСТИ ПОЛКА</div><h1>'+escapeHtml(regiment)+'</h1><p>'+escapeHtml(d.faction)+' · '+visible.length+' публикаций</p></div><a class="btn primary" href="news.html?regiment='+encodeURIComponent(regiment)+'&create=1" '+(isOfficer?'':'hidden')+'>+ Создать новость</a></div><div class="regiment-news-list news-full-list">'+pageItems.map(n=>'<a class="regiment-news-item news-clickable" href="news.html?regiment='+encodeURIComponent(regiment)+'&id='+encodeURIComponent(n.id)+'"><img src="'+n.image+'" alt=""><div class="regiment-news-body"><div class="regiment-news-date">'+n.date+' · '+(n.private?'🔒 Приватная':'🌐 Открытая')+'</div><h3>'+escapeHtml(n.title)+'</h3><p>'+escapeHtml(n.body)+'</p><small>Автор: '+escapeHtml(n.author)+'</small><span class="preview-comment-count" aria-label="Комментарии: '+(window.EMPIRE_COMMENT_COUNTS&&typeof window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount==='function'?window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount(n.id):0)+'"><span class=\"preview-comment-icon\" aria-hidden=\"true\">💬</span> <span>'+(window.EMPIRE_COMMENT_COUNTS&&typeof window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount==='function'?window.EMPIRE_COMMENT_COUNTS.getNewsCommentCount(n.id):0)+'</span></span></div></a>').join('')+'</div>'+pageLinks;
    document.getElementById('commentsSection').hidden=true;
    return;
  }
  let news=allNews().find(n=>String(n.id)===String(id));
  // Восстанавливаем демонстрационную публикацию по её sample-N ID, если ссылка ведёт на старый индекс.
  if(!news){
    const sampleMatch=String(id).match(/^sample-(\d+)$/);
    const sampleIndex=sampleMatch?Number(sampleMatch[1])-1:-1;
    const template=(newsTemplates[regiment]||newsTemplates['1st Regiment'])[sampleIndex];
    if(template)news={id,regiment,title:template[0],date:template[1],author:template[2],privacy:template[3],body:template[4],image:template[5],private:template[6]};
  }
  if(!news){document.getElementById('newsDetail').innerHTML='<div class="empty-note">Эта публикация больше недоступна. Вернитесь в архив и откройте другую новость.</div>';document.getElementById('commentsSection').hidden=true;return;}
  if(news.private&&!isMember){
    document.getElementById('newsDetail').innerHTML='<div class="empty-note">🔒 Эта новость приватная. Она доступна только участникам полка <strong>'+escapeHtml(regiment)+'</strong>.</div>';
    document.getElementById('commentsSection').hidden=true;
    return;
  }
  document.getElementById('newsDetail').innerHTML='<div class="news-detail-head"><div><div class="page-kicker">НОВОСТЬ ПОЛКА</div><h1>'+escapeHtml(news.title||'Новости полка')+'</h1><div class="news-meta">'+escapeHtml(news.date||'')+' · '+escapeHtml(news.author||'Командование')+' · '+(news.private?'🔒 Только для членов полка':'🌐 Открытая')+'</div></div><a class="btn" href="news.html?regiment='+encodeURIComponent(regiment)+'">← Все новости</a></div>'+(news.image?'<img class="news-cover" src="'+escapeHtml(news.image)+'" alt="">':'')+'<div class="news-content">'+(news.body||'<p>Подробности этой публикации пока не добавлены.</p>')+'</div>';
  document.getElementById('commentsSection').hidden=false;renderComments(news);
}
const reportComment=(commentId,commentText,author)=>{
  const key='empire_comment_reports_v1';
  let reports=[];try{reports=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  const duplicate=reports.some(r=>r.status==='pending'&&r.location==='news.html?regiment='+regiment+'#'+news.id&&String(r.commentId)===String(commentId)&&r.reporter===currentUser.name);
  if(duplicate){alert('Вы уже пожаловались на этот комментарий.');return;}
  reports.push({id:'comment-report-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),status:'pending',reporter:currentUser.name,target:author,location:'news.html?regiment='+regiment+'#'+news.id,commentId:String(commentId),comment:String(commentText||''),reason:'Жалоба пользователя',createdAt:new Date().toISOString()});
  localStorage.setItem(key,JSON.stringify(reports));
  alert('Жалоба отправлена модераторам.');
};
function renderComments(news){
  const comments=getComments()[news.id]||[];
  const commentHtml=comments.length?comments.map((c,index)=>{
    const author=String(c.author||'Пользователь');
    const avatar=c.avatar||empireUserAvatar(author);
    const commentId=String(c.id||('comment-'+index));
    const likes=getLikes('news:'+news.id+':'+commentId);
    const preview=likes.slice(0,2).map(escapeHtml).join(', ');
    const likeControls='<div class="comment-reactions"><button class="comment-like-button'+(likes.includes(currentUser.name)?' is-liked':'')+'" type="button" data-like-comment="'+escapeHtml(commentId)+'" aria-pressed="'+likes.includes(currentUser.name)+'">♥ <span>Нравится</span> <b>'+likes.length+'</b></button>'+(likes.length?'<div class="comment-like-popover"><span class="comment-like-preview">'+preview+(likes.length>2?' и ещё':'')+'</span><button type="button" class="comment-like-all" data-show-likes="'+escapeHtml(commentId)+'">Посмотреть всех</button><div class="comment-like-full" hidden>'+likes.map(n=>'<a href="'+empireProfileUrl(n)+'">'+escapeHtml(n)+'</a>').join('')+'</div></div>':'')+'</div>';
    const reportControls='<button class="comment-report-button" type="button" data-report-comment="'+escapeHtml(commentId)+'">⚑ Пожаловаться</button>';
    return '<article class="news-comment" data-news-comment-id="'+escapeHtml(commentId)+'"><a class="news-comment-avatar-link" href="'+empireProfileUrl(author)+'"><img class="news-comment-avatar" src="'+escapeHtml(avatar)+'" alt="'+escapeHtml(author)+'" loading="lazy"></a><div class="news-comment-content"><a class="news-comment-author" href="'+empireProfileUrl(author)+'"><strong>'+escapeHtml(author)+'</strong></a><small>'+escapeHtml(c.date||'')+'</small><p>'+escapeHtml(c.text||'')+'</p>'+likeControls+reportControls+'</div></article>';
  }).join(''):'<p class="empty-note">Пока нет комментариев.</p>';
  document.getElementById('commentsSection').innerHTML='<div class="card-title">💬 Комментарии <span>'+comments.length+'</span></div><div class="news-comments-list">'+commentHtml+'</div><form class="news-comment-form" id="commentForm"><textarea required placeholder="Напишите комментарий..."></textarea><button class="btn primary">Оставить комментарий</button></form>';
  const commentsSection=document.getElementById('commentsSection');
  if(!commentsSection.dataset.likesBound){
    commentsSection.dataset.likesBound='1';
    commentsSection.addEventListener('click',e=>{
      const reportButton=e.target.closest('[data-report-comment]');
      if(reportButton){
        const card=reportButton.closest('[data-news-comment-id]');
        const text=card?.querySelector('.news-comment-content > p')?.textContent||'';
        const author=card?.querySelector('.news-comment-author strong')?.textContent||'Пользователь';
        reportComment(reportButton.dataset.reportComment,text,author);
        return;
      }
      const likeButton=e.target.closest('[data-like-comment]');
      if(likeButton){toggleLike('news:'+news.id+':'+likeButton.dataset.likeComment);renderComments(news);return;}
      const allButton=e.target.closest('[data-show-likes]');
      if(allButton){const panel=allButton.parentElement.querySelector('.comment-like-full');if(panel)panel.hidden=!panel.hidden;}
    });
  }
  document.getElementById('commentForm').addEventListener('submit',e=>{e.preventDefault();const map=getComments();const arr=map[news.id]||[];arr.push({id:'comment-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),author:currentUser.name,avatar:empireUserAvatar(currentUser.name),date:new Date().toLocaleString('ru-RU'),text:e.currentTarget.querySelector('textarea').value});map[news.id]=arr;localStorage.setItem(commentsKey,JSON.stringify(map));renderComments(news);});
}
function renderEditor(){
  const editor=document.getElementById('newsEditor');editor.hidden=false;
  editor.innerHTML='<div class="card-title">✒ Создание новости</div><div class="news-editor-inner"><label>Заголовок<input id="newsTitle" type="text" placeholder="Название новости"></label><label>Видимость<select id="newsPrivacy"><option value="public">Открытая — видят все</option><option value="private">Приватная — только члены полка</option></select></label><div class="editor-toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><button type="button" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" data-cmd="insertUnorderedList">☷</button><button type="button" data-cmd="insertOrderedList">1.</button><button type="button" data-cmd="justifyLeft">←</button><button type="button" data-cmd="justifyCenter">↔</button><button type="button" data-cmd="justifyRight">→</button><button type="button" id="insertLink">🔗</button><button type="button" id="insertImage">🖼</button><button type="button" id="clearFormat">Tx</button></div><div id="newsBodyEditor" class="news-body-editor" contenteditable="true" data-placeholder="Напишите текст новости..."></div><div class="editor-actions"><button class="btn primary" id="publishNews">Опубликовать</button><a class="btn" href="news.html?regiment='+encodeURIComponent(regiment)+'">Отмена</a></div></div>';
  editor.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>document.execCommand(b.dataset.cmd,false,b.dataset.value||null)));
  editor.querySelector('#insertLink').addEventListener('click',()=>{const url=prompt('Ссылка:');if(url)document.execCommand('createLink',false,url);});
  editor.querySelector('#insertImage').addEventListener('click',()=>{const url=prompt('URL изображения:');if(url)document.execCommand('insertImage',false,url);});
  editor.querySelector('#clearFormat').addEventListener('click',()=>document.execCommand('removeFormat'));
  editor.querySelector('#publishNews').addEventListener('click',()=>{
    const title=editor.querySelector('#newsTitle').value.trim();const body=editor.querySelector('#newsBodyEditor').innerHTML.trim();if(!title||!body){alert('Заполните заголовок и текст новости.');return;}
    const arr=getStored();arr.unshift({id:'news-'+Date.now(),regiment,title,date:new Date().toLocaleDateString('ru-RU'),author:currentUser.name,privacy:editor.querySelector('#newsPrivacy').value==='private'?'Приватная':'Открытая',private:editor.querySelector('#newsPrivacy').value==='private',body,image:d.avatar});saveStored(arr);location.href='news.html?regiment='+encodeURIComponent(regiment);
  });
}
if(params.get('create')==='1'){if(isOfficer)renderEditor();else document.getElementById('newsDetail').innerHTML='<div class="empty-note">Создавать новости могут только командир и офицеры этого полка.</div>';}
else renderList();
if(id)renderList();
</script>
</body>
