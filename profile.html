<header class="inner-header">

    <div class="brand">
      
      <div class="brand-title">Clanwars <span>Mount&amp;Blade</span></div>
    </div>
  </div>
</header>
<div class="container">
  <nav class="site-nav">
  <a class="active" href="index.html">Главная</a>
  <a href="regiments.html">Полки</a>
  <a href="battles.html">Сражения</a>

</nav>

  <main class="profile-page">
    <a class="back-link" href="index.html">← Вернуться на главную</a>
    <section class="card profile-header">
      <div class="profile-sidebar">
        <div class="page-kicker">ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ</div>
        <div class="profile-meta">
          <div class="profile-regiment-meta"><span>Полк</span><a id="profileRegimentLink" href="#" class="profile-regiment-link"><img id="profileRegimentLogo" src="assets/aea32583-9230-496e-af65-c2e33f73ff79.png" alt=""><strong id="profileRegiment">Без полка</strong></a></div>
          <div><span>Должность</span><strong id="profileRole">Солдат</strong></div>
          <div class="profile-online-meta"><span>В сети</span><strong id="profileOnlineStatus" class="profile-online-status offline"><i></i><em>Не в сети</em></strong></div>
        </div>
      </div>
      <div class="profile-identity">
        <div class="profile-avatar-wrap"><img id="profileAvatar" class="profile-avatar" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" decoding="async" style="visibility:hidden"><span id="profileRoleBadge" class="profile-role-badge" hidden></span></div>
        <h1 id="profileName">Пользователь</h1>
      </div>
      <div class="profile-actions" id="profileActions"></div>
    </section>

    <div class="profile-rating-message-grid">
      <section class="card profile-section profile-messages-section" style="display:block!important;visibility:visible!important;opacity:1!important;margin:0!important;border:1px solid #5a4630!important;background:#17130f!important;">
        <div class="card-title" style="display:block!important;color:#d2b16f!important;font-weight:700!important;">✉ &nbsp; Переписка</div>
        <div id="messageArea" style="display:block!important;min-height:70px;"></div>
      </section>
      <aside class="profile-side-stack">
        <section class="card profile-section user-rating-section"><div class="card-title">⭐ Рейтинг</div><div id="profileUserRating"></div></section>
        <section class="card profile-section">
          <div class="card-title">👁 &nbsp; Гости профиля</div>
          <div class="profile-friends" id="profileGuests"></div>
        </section>
        <section class="card profile-section">
          <div class="card-title">📜 &nbsp; Послужной список</div>
          <div class="service-list" id="serviceList"></div>
        </section>
      </aside>
    </div>
  </main>
