<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/png" href="assets/empire_logo_top_right.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — EMPIRE</title>
  <link rel="stylesheet" href="assets/style.css?v=20261108-msg2">
</head>
<body>
<header>
  <div class="container">
    <div class="brand">
      <a class="brand-logo-link" href="index.html"><img class="site-logo" src="assets/empire_logo_top_right.png" alt="EMPIRE"></a>
      <div class="brand-title">EMPIRE <span>Napoleonic Wars</span></div>
    </div>
  </div>
</header>
<div class="container">
  <nav>
    <a href="index.html">Главная</a>
    <a href="regiments.html">Полки</a>
    <a href="index.html#battles">Кампании</a>
    <a href="index.html#ranking">Рейтинг</a>
    <a href="index.html#news">Форум</a>
    <a href="index.html#alliances">Союзы</a>
    <span style="margin-left:auto"></span>
    <a href="#">♟ Войти</a>
  </nav>

  <main class="profile-page">
    <a class="back-link" href="index.html">← Вернуться на главную</a>
    <section class="card profile-header">
      <div class="profile-avatar-wrap"><img id="profileAvatar" class="profile-avatar" src="assets/default-soldier.jpg" alt=""></div>
      <div class="profile-main">
        <div class="page-kicker">ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ</div>
        <h1 id="profileName">Пользователь</h1>
        <div class="profile-meta">
          <div><span>Полк</span><strong id="profileRegiment">Без полка</strong></div>
          <div><span>Статус</span><strong id="profileRole">Солдат</strong></div>
        </div>
        <div class="profile-friend-action">
          <button id="friendButton" class="friend-add-button" type="button">Добавить в друзья</button>
        </div>
      </div>
    </section>

    <section class="card profile-section profile-messages-section" style="display:block!important;visibility:visible!important;opacity:1!important;margin:14px 0!important;border:1px solid #5a4630!important;background:#17130f!important;">
      <div class="card-title" style="display:block!important;color:#d2b16f!important;font-weight:700!important;">✉ &nbsp; Переписка</div>
      <div id="messageArea" style="display:block!important;min-height:70px;">
        <div style="padding:20px;text-align:center;color:#b6a68e;font-size:12px;">Загрузка переписки…</div>
      </div>
    </section>
<div class="profile-columns">
      <section class="card profile-section">
        <div class="card-title">♟ &nbsp; Друзья профиля</div>
        <div class="profile-friends" id="profileFriends"></div>
      </section>

      <section class="card profile-section">
        <div class="card-title">📜 &nbsp; Послужной список</div>
        <div class="service-list" id="serviceList"></div>
      </section>
    </div>
  </main>
</div>

<script>
const profiles={
  "Kalashnikov":{avatar:"assets/avatar.jpg",regiment:"1st Regiment",role:"Глава клана",friends:["Veli4estvo","Kazak","Grenadier87"],service:[
    {regiment:"1st Regiment",from:"01.10.2026",to:"по настоящее время"}]},
  "Ankord":{avatar:"assets/avatar.jpg",regiment:"1st Regiment",role:"Глава клана",friends:["Veli4estvo","Mel","Kazak"],service:[
    {regiment:"1st Regiment",from:"01.10.2026",to:"по настоящее время"}]},
  "Veli4estvo":{avatar:"assets/images (4).jpg",regiment:"1st Regiment",role:"Офицер",friends:["Ankord","Kazak","MeGusta"],service:[
    {regiment:"1st Regiment",from:"05.10.2026",to:"по настоящее время"}]},
  "Mel":{avatar:"assets/images (1).jpg",regiment:"1st Regiment",role:"Солдат",friends:["Veli4estvo","Kazak"],service:[
    {regiment:"1st Regiment",from:"08.10.2026",to:"по настоящее время"}]},
  "Kazak":{avatar:"assets/images (6).jpg",regiment:"1st Regiment",role:"Офицер",friends:["Ankord","Veli4estvo","Flashkodr"],service:[
    {regiment:"1st Regiment",from:"12.10.2026",to:"по настоящее время"}]},
  "MeGusta":{avatar:"assets/images.jpg",regiment:"1st Regiment",role:"Солдат",friends:["Flashkodr","Theodor","Veli4estvo"],service:[
    {regiment:"1st Regiment",from:"24.10.2026",to:"по настоящее время"}]},
  "Flashkodr":{avatar:"assets/images (2).jpg",regiment:"1st Regiment",role:"Солдат",friends:["MeGusta","MrDixon"],service:[
    {regiment:"1st Regiment",from:"29.10.2026",to:"по настоящее время"}]},
  "MrDixon":{avatar:"assets/images (3).jpg",regiment:"1st Regiment",role:"Солдат",friends:["Flashkodr","Theodor"],service:[
    {regiment:"1st Regiment",from:"01.11.2026",to:"по настоящее время"}]},
  "Theodor":{avatar:"assets/images (5).jpg",regiment:"1st Regiment",role:"Солдат",friends:["MeGusta","MrDixon"],service:[
    {regiment:"1st Regiment",from:"01.11.2026",to:"по настоящее время"}]},
  "Grenadier87":{avatar:"assets/images.jpg",regiment:"1st Regiment",role:"Солдат",friends:["Kalashnikov","Veli4estvo"],service:[
    {regiment:"1st Regiment",from:"15.10.2026",to:"по настоящее время"}]},
  "Marquis":{avatar:"assets/images (1).jpg",regiment:"95th Rifles",role:"Офицер",friends:["Grenadier87","Fusilier"],service:[
    {regiment:"95th Rifles",from:"12.09.2026",to:"по настоящее время"}]},
  "Fusilier":{avatar:"assets/images (2).jpg",regiment:"Без полка",role:"Солдат",friends:["Marquis"],service:[]}
};
const fallback={avatar:"assets/default-soldier.jpg",regiment:"Без полка",role:"Солдат",friends:[],service:[]};
const user=new URLSearchParams(location.search).get("user")||"Kalashnikov";
const d=profiles[user]||fallback;
document.title=user+" — EMPIRE";
document.getElementById("profileAvatar").src=d.avatar;
document.getElementById("profileAvatar").alt="Аватар "+user;
document.getElementById("profileName").textContent=user;
document.getElementById("profileRegiment").textContent=d.regiment;
document.getElementById("profileRole").textContent=d.role;

const currentUser="Kalashnikov";
const friendButton=document.getElementById("friendButton");
if(user===currentUser){
  friendButton.style.display="none";
}else{
  const alreadyFriend=(profiles[currentUser]?.friends||[]).includes(user);
  const setFriendState=(isFriend)=>{
    friendButton.textContent=isFriend?"Друг":"Добавить в друзья";
    friendButton.classList.toggle("is-friend",isFriend);
    friendButton.disabled=isFriend;
  };
  setFriendState(alreadyFriend);
  friendButton.onclick=()=>{
    setFriendState(true);
  };
}
document.getElementById("profileFriends").innerHTML=d.friends.length?d.friends.map(name=>{
 const p=profiles[name]||fallback;
 return '<a class="profile-friend" href="profile.html?v=20261108-msg&user='+encodeURIComponent(name)+'"><img src="'+p.avatar+'" alt=""><span>'+name+'</span></a>';
}).join(""):'<p class="empty-note">Друзей пока нет.</p>';
document.getElementById("serviceList").innerHTML=d.service.length?d.service.map(x=>'<div class="service-item"><div class="service-regiment">'+x.regiment+'</div><div class="service-dates"><span>С '+x.from+'</span><span>По '+x.to+'</span></div></div>').join(""):'<p class="empty-note">Послужной список пока пуст.</p>';

const conversations={
  "Kalashnikov":[{from:"Ankord",text:"Привет! Как подготовка к следующему бою?",time:"19:12"},{from:"Kalashnikov",text:"Всё готово. Собираем состав к вечеру.",time:"19:15"}],
  "Ankord":[{from:"Kalashnikov",text:"Командир, состав на тренировку готов.",time:"18:46"},{from:"Ankord",text:"Отлично. Встречаемся в 21:00.",time:"18:49"}],
  "Veli4estvo":[{from:"Kalashnikov",text:"Проведёшь сегодня обучение новичков?",time:"17:20"},{from:"Veli4estvo",text:"Да, всё организую.",time:"17:23"}],
  "Mel":[{from:"Mel",text:"Есть новости по следующему бою?",time:"16:10"},{from:"Kalashnikov",text:"Пока ждём подтверждения соперника.",time:"16:14"}],
  "Kazak":[{from:"Kazak",text:"Скинь расписание тренировки.",time:"15:02"},{from:"Kalashnikov",text:"Отправлю в общий чат.",time:"15:05"}],
  "MeGusta":[{from:"MeGusta",text:"Спасибо за тренировку!",time:"14:31"},{from:"Kalashnikov",text:"Всегда пожалуйста.",time:"14:34"}],
  "Flashkodr":[{from:"Flashkodr",text:"Сегодня в 21:00 сбор?",time:"13:08"},{from:"Kalashnikov",text:"Да.",time:"13:10"}]
};
const history=conversations[user];
const messageArea=document.getElementById("messageArea");
if(history){
 messageArea.innerHTML='<div class="message-history">'+history.map(m=>{
  const me=m.from==="Kalashnikov";
  return '<div class="private-message '+(me?'mine':'')+'"><img src="'+(profiles[m.from]||fallback).avatar+'" alt=""><div><b>'+m.from+'</b><p>'+m.text+'</p><span>'+m.time+'</span></div></div>';
 }).join("")+'</div><div class="message-compose"><input id="privateMessageInput" placeholder="Написать сообщение..."><button id="privateMessageSend">Отправить</button></div>';
}else{
 messageArea.innerHTML='<div class="no-conversation"><p>Переписки с пользователем пока нет.</p><button class="btn primary" id="startConversation">Написать сообщение</button></div>';
 document.getElementById("startConversation").onclick=()=>{messageArea.innerHTML='<div class="message-compose standalone"><input id="privateMessageInput" placeholder="Написать сообщение..."><button id="privateMessageSend">Отправить</button></div>';bindPrivateSend();};
}
function bindPrivateSend(){
 const input=document.getElementById("privateMessageInput"),button=document.getElementById("privateMessageSend");
 button.onclick=()=>{const text=input.value.trim();if(!text)return;messageArea.innerHTML='<div class="message-history"><div class="private-message mine"><img src="'+profiles.Kalashnikov.avatar+'" alt=""><div><b>Kalashnikov</b><p>'+text.replace(/</g,"&lt;")+'</p><span>сейчас</span></div></div></div><div class="message-compose"><input id="privateMessageInput" placeholder="Написать сообщение..."><button id="privateMessageSend">Отправить</button></div>';bindPrivateSend();};
 input.onkeydown=e=>{if(e.key==="Enter")button.click();};
}
if(history)bindPrivateSend();
</script>
</body>
</html>
